plugins {
    id 'com.android.application'
}

// Valinnainen oletuskeikka. Sovellus kysyy tunnuksen itse (Omat keikkani), mutta jos
// rakennusvaiheessa on annettu tunnus, ensimmäinen käynnistys avaa suoraan sen keikan.
// Tunnusta ei kirjoiteta repoon: tunnuksella saa workerista keikan otsikon, äänilinkin ja
// biisilistan, ja repo on julkinen. Lisää halutessasi Macin tiedostoon
// ~/.gradle/gradle.properties rivi:  soitin.tunnus=<tunnus>
// Tunnus menee vain debug-rakennukseen. Release on julkisesti jaettava APK
// (soitin/soitin.apk), eikä siihen tule tunnusta, vaikka ominaisuus olisi asetettu.
def soitinTunnus = (findProperty('soitin.tunnus') ?: '').toString().trim().toLowerCase()
boolean tunnusKelpaa = soitinTunnus ==~ /[a-z0-9]{4,32}/

gradle.taskGraph.whenReady { graph ->
    boolean apkRequested = graph.allTasks.any {
        it.project == project && it.name ==~ /(assemble|install|package|bundle).*/
    }
    if (apkRequested && soitinTunnus && !tunnusKelpaa) {
        throw new GradleException("Virheellinen Gradle-ominaisuus 'soitin.tunnus' " +
                "(4–32 merkkiä a–z ja 0–9). Korjaa tai poista se tiedostosta ~/.gradle/gradle.properties.")
    }
}

android {
    namespace 'fi.tusinasaa.soitin'
    compileSdk 34

    defaultConfig {
        applicationId 'fi.tusinasaa.soitin'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    // Kaikki versiot (Macin debug-rakennus, julkinen APK) allekirjoitetaan samalla
    // avaimella, jotta ne asentuvat toistensa päälle ja Omat keikkani säilyy päivityksessä.
    // Avain on tarkoituksella repossa: se ei suojaa mitään salaista, vaan vain yhdistää
    // versiot. Älä vaihda sitä, tai päivitys vaatii sovelluksen poistamisen ensin.
    signingConfigs {
        julkinen {
            storeFile file('julkinen.jks')
            storePassword 'soitin'
            keyAlias 'soitin'
            keyPassword 'soitin'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.julkinen
            buildConfigField 'String', 'GIG_KEY', '"' + (tunnusKelpaa ? soitinTunnus : '') + '"'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.julkinen
            buildConfigField 'String', 'GIG_KEY', '""'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media:media:1.7.0'
}
