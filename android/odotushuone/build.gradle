plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

String quoted(Object value) {
    String s = value == null ? '' : value.toString().trim()
    return '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// Pitkä äänenvoimakkuus ylös avaa Tusinasään sijaintilinkillä. Token ja avain luetaan
// Gradle-ominaisuuksista (esim. ~/.gradle/gradle.properties), eivät ne koskaan päädy repoon.
def tusinasaaToken = (findProperty('odotushuone.tusinasaa.token') ?: '').toString().trim()
def tusinasaaKey = (findProperty('odotushuone.tusinasaa.key') ?: '').toString().trim()

gradle.taskGraph.whenReady { graph ->
    boolean apkRequested = graph.allTasks.any {
        it.project == project && it.name ==~ /(assemble|install|package|bundle).*/
    }
    if (apkRequested && (!tusinasaaToken || !tusinasaaKey)) {
        throw new GradleException("Puuttuu Gradle-ominaisuus 'odotushuone.tusinasaa.token' tai " +
                "'odotushuone.tusinasaa.key'. Lisää ne tiedostoon ~/.gradle/gradle.properties.")
    }
}

android {
    namespace 'fi.tusinasaa.odotushuone'
    compileSdk 34

    defaultConfig {
        applicationId 'fi.tusinasaa.odotushuone'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'TUSINASAA_TOKEN', quoted(tusinasaaToken)
        buildConfigField 'String', 'TUSINASAA_KEY', quoted(tusinasaaKey)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
