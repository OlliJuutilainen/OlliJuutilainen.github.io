<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e4">
<meta name="description" content="4 × 4 -bingo jouluelokuvien kliseistä. Ruksaa ruutu, kun klisee osuu kohdalle.">
<meta property="og:title" content="Jouluelokuvabingo">
<meta property="og:description" content="4 × 4 -bingo jouluelokuvien kliseistä.">
<title>Jouluelokuvabingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e5634'/%3E%3Cpath d='M16 4l3.5 7.6 8.3.9-6.2 5.6 1.8 8.2L16 22l-7.4 4.3 1.8-8.2-6.2-5.6 8.3-.9z' fill='%23c9a227'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --paper: #f6f1e4;
    --paper-2: #ece4cf;
    --ink: #1f1a16;
    --muted: #6b6255;
    --red: #9a1f1f;
    --red-ink: #fff8ec;
    --green: #1e5634;
    --gold: #d4ab2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    padding: 1.2rem 16px 2rem;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 1rem; }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(1.75rem, 8vw, 2.5rem);
    line-height: 1.1;
    margin: 0;
    color: var(--red);
  }
  .sub {
    margin: .3rem 0 0;
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--green);
  }
  .ohje {
    margin: .7rem auto 0;
    max-width: 30em;
    font-size: .9rem;
    line-height: 1.4;
    color: var(--muted);
  }

  /* Lappu: kaikki rivit yhtä korkeita (1fr), vähintään neliöitä. */
  .lappu {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 5px;
    padding: 5px;
    background: var(--green);
    border-radius: 10px;
  }
  .ruutu {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    aspect-ratio: 1 / 1;
    min-width: 0;
    margin: 0;
    padding: 4px 3px;
    border: 0;
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: clamp(.74rem, 3.3vw, .95rem);
    line-height: 1.18;
    text-align: center;
    hyphens: manual;
    -webkit-hyphens: manual;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .ruutu:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  /* Ruksattu ruutu: tumma pohja, vaalea teksti. Erottuu myös harmaasävyisenä (sähköpaperi). */
  .ruutu[aria-pressed="true"] {
    background: var(--red);
    color: var(--red-ink);
    font-weight: 600;
  }
  /* Bingorivin ruutu: kultainen kehys ja tähti. */
  .ruutu.voitto { box-shadow: inset 0 0 0 3px var(--gold); }
  .ruutu.voitto::after {
    content: "★";
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: .8rem;
    line-height: 1;
    color: var(--gold);
  }

  .tila {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin: .8rem 2px 0;
    font-size: .9rem;
    color: var(--muted);
  }
  .tila b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .napit {
    display: flex;
    gap: .6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 1rem;
  }
  .nappi {
    appearance: none;
    font: inherit;
    font-size: .95rem;
    padding: .55rem 1.1rem;
    border-radius: 999px;
    border: 2px solid var(--green);
    background: transparent;
    color: var(--green);
    cursor: pointer;
    touch-action: manipulation;
  }
  .nappi.paa { background: var(--green); color: var(--paper); }
  .nappi:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Bingojuhla */
  .juhla {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(20, 40, 28, .72);
    overflow: hidden;
  }
  .juhla[hidden] { display: none; }
  .kortti {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 22rem;
    padding: 1.6rem 1.2rem 1.3rem;
    border-radius: 14px;
    border: 3px solid var(--gold);
    background: var(--paper);
    text-align: center;
    animation: pomppu .35s ease-out;
  }
  .kortti .iso {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: clamp(2.4rem, 13vw, 3.4rem);
    font-weight: 700;
    line-height: 1;
    color: var(--red);
  }
  .kortti .mika {
    margin: .5rem 0 0;
    font-size: .8rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--green);
  }
  .kortti .lause { margin: .9rem 0 1.2rem; font-size: 1rem; line-height: 1.4; }
  .lumi span {
    position: absolute;
    top: -2rem;
    color: #fff;
    opacity: .9;
    animation: putoa var(--kesto) linear var(--viive) 1 both;
    pointer-events: none;
  }
  @keyframes putoa {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--ajelu), 110vh); }
  }
  @keyframes pomppu {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lumi { display: none; }
    .kortti { animation: none; }
  }

  .foot {
    margin: 2.2rem 0 0;
    text-align: center;
    color: var(--muted);
    opacity: .6;
    font-size: .68rem;
    font-weight: 300;
    letter-spacing: .14em;
  }

  @media print {
    body { padding: 0; }
    .tila, .napit, .juhla { display: none !important; }
    .ruutu { border: 1px solid #000; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Jouluelokuvabingo</h1>
    <p class="sub">4 × 4 · kliseet ruutuun</p>
    <p class="ohje">Napauta ruutua, kun klisee osuu kohdalle. Neljä peräkkäin vaakaan, pystyyn tai vinoon on bingo.</p>
  </header>

  <main>
    <div class="lappu" id="lappu" role="group" aria-label="Bingolappu"></div>
    <div class="tila" aria-live="polite">
      <span>Ruksattu <b id="maara">0/16</b></span>
      <span>Bingoja <b id="bingot">0</b></span>
    </div>
    <div class="napit">
      <button class="nappi" id="tyhjenna" type="button">Pyyhi ruksit</button>
      <button class="nappi paa" id="uusi" type="button">Uusi lappu</button>
    </div>
  </main>

  <p class="foot">© TUSINASOFT 2026</p>
</div>

<div class="juhla" id="juhla" hidden>
  <div class="lumi" id="lumi" aria-hidden="true"></div>
  <div class="kortti" role="dialog" aria-modal="true" aria-labelledby="juhlaIso">
    <p class="iso" id="juhlaIso">BINGO!</p>
    <p class="mika" id="juhlaMika"></p>
    <p class="lause" id="juhlaLause"></p>
    <button class="nappi paa" id="jatka" type="button">Jatketaan katsomista</button>
  </div>
</div>

<script>
// "|" merkitsee yhdyssanan rajan. Muut tavutuskohdat lisätään automaattisesti suomen
// perussäännöllä (katko ennen konsonanttia, jota seuraa vokaali), jotta pitkä sana katkeaa
// kapeassa ruudussa tavurajalta eikä vuoda yli. Yhdyssanan rajaa sääntö ei tunne, siksi "|".
// Lapun 16 ruudusta 11 arvotaan YDIN-kliseistä ja 5 LISÄ-kliseistä.
const YDIN = [
  ['misteli', 'Mistelin|oksa'],
  ['munatoti', 'Munatoti'],
  ['tormays', 'Törmää vahingossa ihastukseen'],
  ['vanhempi', 'Äiti tai isä on kuollut'],
  ['exa', 'Kiusallinen kohtaaminen exän kanssa'],
  ['taika', '”Uskotko joulun taikaan?”'],
  ['kaveri', 'Nais|pää|osan avulias kaveri'],
  ['videopuhelu', 'Video|puhelu: äiti leipoo tai kokkaa'],
  ['koristelu', 'Kuusta koristellaan yhdessä'],
  ['keinolumi', 'Selvästi keino|tekoista lunta'],
  ['luistelu', 'Luistelua'],
  ['kylma', '”Onpa kylmä!” – hengitys ei höyryä'],
  ['suudelma', 'Ensi|suudelma keskeytyy yllättäen'],
  ['tenava', 'Tenava: ”Tämä on tosi|rakkautta!”'],
  ['haltija', 'Haltija|ukko auttaa ja iskee silmää'],
  ['hyvantekevaisyys', 'Työ: lapset tai hyvän|teke|väisyys'],
  ['kilpailu', 'Pipar|kakku- tai koristelu|kilpailu'],
];
const LISA = [
  ['kotikyla', 'Ura|ihminen palaa koti|kylään'],
  ['puuseppa', 'Komea puu|seppä flanelli|paidassa'],
  ['suuryhtio', 'Suur|yhtiö uhkaa perhe|yritystä'],
  ['poikaystava', 'Tylsä poika|ystävä jää kaupunkiin'],
  ['pukki', 'Joulu|pukki saattaa olla oikea'],
  ['kaakao', 'Kaakaota vaahto|karkeilla'],
  ['neuleet', 'Rumat joulu|neuleet'],
  ['kuusi', 'Kuusi haetaan itse metsästä'],
  ['vaarinkasitys', 'Puoliksi kuultu, väärin ymmärretty'],
  ['lumisade', 'Lumi|sade alkaa kesken suudelman'],
  ['valot', 'Kaupungin joulu|valot syttyvät'],
  ['takaraja', 'Takaraja: joulu|aatto'],
  ['kengat', 'Korko|kengät lumi|hangessa'],
  ['jouluihminen', '”En ole mikään joulu|ihminen.”'],
  ['lumipallo', 'Lumi|pallo|sota'],
  ['reki', 'Reki- tai hevos|vaunu|ajelu'],
  ['leski', 'Leski-isä ja suloinen lapsi'],
  ['koriste', 'Kuusen|koriste, jolla on tarina'],
  ['kaupunki', 'Kaupungin nimi on jouluinen'],
  ['prinssi', 'Prinssi pienestä kuningas|kunnasta'],
  ['ylennys', 'Ylennys hylätään rakkauden vuoksi'],
  ['koira', 'Koira joulu|asussa'],
  ['laulu', 'Joulu|lauluja yhdessä'],
  ['lumiukko', 'Rakennetaan lumi|ukko'],
  ['muisto', 'Tarina lapsuuden joulusta'],
];
const VOKAALIT = 'aeiouyäöå';
function tavuta(teksti) {
  const shy = '\u00AD';
  const osat = teksti.replace(/[A-Za-zÅÄÖåäö]+/g, sana => {
    if (sana.length < 6) return sana;
    const s = sana.toLowerCase();
    let tulos = '', alku = 0;
    // Vähintään kaksi merkkiä katkon kummallekin puolelle, ja edeltävässä palassa oltava vokaali.
    for (let i = 2; i < s.length - 2; i++) {
      if (!VOKAALIT.includes(s[i]) && VOKAALIT.includes(s[i + 1])
          && [...s.slice(alku, i)].some(m => VOKAALIT.includes(m))) {
        tulos += sana.slice(alku, i) + shy;
        alku = i;
      }
    }
    return tulos + sana.slice(alku);
  });
  return osat.replace(/\|/g, shy);
}
const TEKSTI = new Map([...YDIN, ...LISA].map(([id, t]) => [id, tavuta(t)]));

// 4 vaakariviä, 4 pystyriviä ja 2 lävistäjää.
const RIVIT = [];
for (let r = 0; r < 4; r++) RIVIT.push({ nimi: 'Vaakarivi ' + (r + 1), ruudut: [0, 1, 2, 3].map(c => r * 4 + c) });
for (let c = 0; c < 4; c++) RIVIT.push({ nimi: 'Pystyrivi ' + (c + 1), ruudut: [0, 1, 2, 3].map(r => r * 4 + c) });
RIVIT.push({ nimi: 'Lävistäjä ↘', ruudut: [0, 5, 10, 15] });
RIVIT.push({ nimi: 'Lävistäjä ↙', ruudut: [3, 6, 9, 12] });

const LAUSEET = [
  'Joulun taika on todellista.',
  'Kaakaota kaikille!',
  'Haltijaukko iskee silmää.',
  'Lumi alkaa sataa juuri oikealla hetkellä.',
  'Pikkukaupunki on pelastettu. Taas.',
  'Tenava tiesi sen koko ajan.',
];

const AVAIN = 'jouluelokuvabingo.v1';
let tila = null; // { ids: [16], ruksit: [16], valmiit: [rivi-indeksit], taysi: bool }

function sekoita(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function arvoLappu() {
  const ids = sekoita([
    ...sekoita(YDIN).slice(0, 11),
    ...sekoita(LISA).slice(0, 5),
  ].map(([id]) => id));
  return { ids, ruksit: Array(16).fill(false), valmiit: [], taysi: false };
}
function lataa() {
  try {
    const t = JSON.parse(localStorage.getItem(AVAIN));
    if (t && Array.isArray(t.ids) && t.ids.length === 16 && t.ids.every(id => TEKSTI.has(id))
        && Array.isArray(t.ruksit) && t.ruksit.length === 16) {
      return { ids: t.ids, ruksit: t.ruksit.map(Boolean), valmiit: Array.isArray(t.valmiit) ? t.valmiit : [], taysi: !!t.taysi };
    }
  } catch (e) {}
  return null;
}
function tallenna() {
  try { localStorage.setItem(AVAIN, JSON.stringify(tila)); } catch (e) {}
}

const lappuEl = document.getElementById('lappu');
const ruudut = [];
for (let i = 0; i < 16; i++) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ruutu';
  b.addEventListener('click', () => napauta(i));
  lappuEl.appendChild(b);
  ruudut.push(b);
}

function valmiitRivit() {
  return RIVIT.map((r, i) => r.ruudut.every(k => tila.ruksit[k]) ? i : -1).filter(i => i >= 0);
}
function piirra() {
  const voittoruudut = new Set(valmiitRivit().flatMap(i => RIVIT[i].ruudut));
  ruudut.forEach((b, i) => {
    b.textContent = TEKSTI.get(tila.ids[i]);
    b.setAttribute('aria-pressed', tila.ruksit[i] ? 'true' : 'false');
    b.classList.toggle('voitto', voittoruudut.has(i));
  });
  document.getElementById('maara').textContent = tila.ruksit.filter(Boolean).length + '/16';
  document.getElementById('bingot').textContent = valmiitRivit().length;
}

function napauta(i) {
  tila.ruksit[i] = !tila.ruksit[i];
  const nyt = valmiitRivit();
  const uudet = nyt.filter(r => !tila.valmiit.includes(r));
  tila.valmiit = nyt;
  const taysiNyt = tila.ruksit.every(Boolean);
  const uusiTaysi = taysiNyt && !tila.taysi;
  tila.taysi = taysiNyt;
  tallenna();
  piirra();
  if (uusiTaysi) juhli('TÄYSI LAPPU!', 'Kaikki 16 kliseetä', 'Tämä elokuva on täydellinen. Siis täydellisen ennalta-arvattava.');
  else if (uudet.length > 1) juhli('TUPLABINGO!', uudet.map(r => RIVIT[r].nimi).join(' + '), arvoLause());
  else if (uudet.length === 1) juhli('BINGO!', RIVIT[uudet[0]].nimi, arvoLause());
}
function arvoLause() { return LAUSEET[Math.floor(Math.random() * LAUSEET.length)]; }

const juhlaEl = document.getElementById('juhla');
const lumiEl = document.getElementById('lumi');
let edellinenFokus = null;
function juhli(iso, mika, lause) {
  document.getElementById('juhlaIso').textContent = iso;
  document.getElementById('juhlaMika').textContent = mika;
  document.getElementById('juhlaLause').textContent = lause;
  lumiEl.innerHTML = '';
  for (let k = 0; k < 28; k++) {
    const s = document.createElement('span');
    s.textContent = k % 3 ? '•' : '❄';
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (0.6 + Math.random() * 1.1).toFixed(2) + 'rem';
    s.style.setProperty('--kesto', (2.6 + Math.random() * 2).toFixed(2) + 's');
    s.style.setProperty('--viive', (Math.random() * 1.2).toFixed(2) + 's');
    s.style.setProperty('--ajelu', ((Math.random() - .5) * 60).toFixed(0) + 'px');
    lumiEl.appendChild(s);
  }
  edellinenFokus = document.activeElement;
  juhlaEl.hidden = false;
  document.getElementById('jatka').focus();
}
function suljeJuhla() {
  juhlaEl.hidden = true;
  lumiEl.innerHTML = '';
  if (edellinenFokus && edellinenFokus.focus) edellinenFokus.focus();
}
document.getElementById('jatka').addEventListener('click', suljeJuhla);
juhlaEl.addEventListener('click', e => { if (e.target === juhlaEl) suljeJuhla(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !juhlaEl.hidden) suljeJuhla(); });

document.getElementById('uusi').addEventListener('click', () => {
  if (tila.ruksit.some(Boolean) && !confirm('Arvotaanko uusi lappu? Nykyiset ruksit häviävät.')) return;
  tila = arvoLappu();
  tallenna();
  piirra();
});
document.getElementById('tyhjenna').addEventListener('click', () => {
  if (!tila.ruksit.some(Boolean)) return;
  if (!confirm('Pyyhitäänkö ruksit? Lappu pysyy samana.')) return;
  tila.ruksit = Array(16).fill(false);
  tila.valmiit = [];
  tila.taysi = false;
  tallenna();
  piirra();
});

tila = lataa() || arvoLappu();
tallenna();
piirra();
</script>
</body>
</html>
