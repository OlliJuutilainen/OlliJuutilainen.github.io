<!DOCTYPE html>
<html lang="fi" class="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Palkkikoe Firefox</title>
<!-- Luinin palkkivaran koe Firefoxille (8.11.2026). Bravella Nordilla toimi 150lvh:n vara (palkkikoe.html, muunnelmat D
     ja G), ja se on luin.html:ssä nyt (html.palkkivara). Tämä sivu lähtee siitä (A = Luin nyt) ja muuttaa yhtä asiaa
     kerrallaan niistä, joihin Firefoxin (GeckoView, dynaaminen työkalupalkki) arvellaan reagoivan toisin kuin Chromium.
     Palkkeja ei ole testiselaimessa, joten muunnelmat kokeillaan oikealla laitteella. Sivu kertoo itse, piiloutuivatko
     palkit: ikkuna kasvoi alusta yli 20 px tai ikkuna = 100lvh, kun lvh ja svh eroavat. -->
<style>
  :root { --paperi: #faf5ea; --muste: #231c14; --harmaa: #67553f; --viiva: #cbb99c; --ruoste: #8c5426; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paperi); color: var(--muste); font: 17px/1.5 Georgia, serif; }
  #ohjaus { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: var(--paperi); border-bottom: 1px solid var(--viiva);
    padding: 8px 10px 6px; font: 14px/1.35 system-ui, sans-serif; }
  #napit { display: flex; flex-wrap: wrap; gap: 6px; }
  #napit button { font: inherit; padding: 6px 9px; border: 1px solid var(--harmaa); background: none; color: var(--muste); }
  #napit button.valittu { background: var(--muste); color: var(--paperi); }
  #kuvaus { margin: 6px 0 2px; color: var(--harmaa); }
  #lukema { font-weight: 700; font-variant-numeric: tabular-nums; }
  #tulos { font-size: 22px; font-weight: 800; margin-top: 2px; }
  #tulos.kylla { color: #2f6b2f; }
  #tulos.ei { color: var(--ruoste); }
  #sivu { position: fixed; left: 0; right: 0; bottom: 62px; overflow: hidden; }
  #teksti { height: 100%; column-width: 100vw; column-gap: 0; padding: 0 20px; box-sizing: border-box; transform: translateX(0); }
  #ala { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; border-top: 1px solid var(--viiva); background: var(--paperi);
    display: flex; align-items: center; justify-content: center; color: var(--harmaa); font: 14px system-ui, sans-serif; }
  #mitta-l { position: fixed; top: 0; left: 0; width: 0; height: 100vh; height: 100lvh; visibility: hidden; pointer-events: none; }
  #mitta-s { position: fixed; top: 0; left: 0; width: 0; height: 100vh; height: 100svh; visibility: hidden; pointer-events: none; }

  /* Muunnelmat (luokka html:ssä). Pohja kaikille paitsi V: body 150lvh kuten Luinissa. */
  html:not(.v) body { box-sizing: border-box; min-height: 150vh; min-height: 150lvh; }
  /* Juuren overflow hidden auto: kaikki paitsi C, G ja V. */
  html.a, html.b, html.d, html.e, html.f, html.h { overflow: hidden auto; }
  /* Ei vetämällä päivitystä: kaikki paitsi B, G ja V. */
  html.a, html.c, html.d, html.e, html.f, html.h { overscroll-behavior-y: none; }
  /* D ja G: palsta ei ole vieritysalue. */
  html.d #sivu, html.g #sivu { overflow: clip; }
  /* F: palsta ei ota kosketuksia; sormi osuu dokumenttiin (body) eikä kiinteään elementtiin. */
  html.f #sivu { pointer-events: none; }
  /* H: palsta on tavallisessa virrassa ja pysyy paikallaan stickynä, ei position: fixed. */
  html.h #sivu, html.g #sivu { position: sticky; top: var(--ohjaus); bottom: auto; height: calc(100svh - var(--ohjaus) - 62px); }
  /* V: vertailu, tavallinen pitkä sivu. */
  html.v #sivu { position: static; overflow: visible; margin-top: var(--ohjaus); }
  html.v #teksti { column-width: auto; height: auto; padding-bottom: 80px; }
</style>
</head>
<body>
<div id="mitta-l"></div><div id="mitta-s"></div>
<div id="ohjaus">
  <div id="napit">
    <button data-m="a">A nyt</button><button data-m="b">B</button><button data-m="c">C</button><button data-m="d">D</button>
    <button data-m="e">E</button><button data-m="f">F</button><button data-m="h">H</button>
    <button data-m="g">G kaikki</button><button data-m="v">V vertailu</button>
  </div>
  <div id="kuvaus"></div>
  <div id="lukema"></div>
  <div id="tulos"></div>
</div>
<div id="sivu"><article id="teksti"></article></div>
<div id="ala">alapalkki</div>
<script>
(function () {
  var KUVAUS = {
    a: 'A: kuten Luin nyt (Bravella toimiva). Juuri overflow hidden auto, ei vetämällä päivitystä, sivu 150 % korkeudesta, palsta kiinteä ja overflow hidden, palstassa ei-passiivinen touchmove.',
    b: 'B: kuin A, mutta vetämällä päivitys sallittu (ei overscroll-behavioria).',
    c: 'C: kuin A, mutta juuren overflow näkyvä (ei overflow hidden autoa).',
    d: 'D: kuin A, mutta palsta overflow clip (ei vieritysaluetta).',
    e: 'E: kuin A, mutta palstan touchmove-kuuntelija passiivinen.',
    f: 'F: kuin A, mutta palsta ei ota kosketuksia (sormi osuu dokumenttiin, ei kiinteään elementtiin).',
    h: 'H: kuin A, mutta palsta sticky tavallisessa virrassa eikä kiinteä.',
    g: 'G: kaikki: B + C + D + E + H (F:ää ei tarvita, koska sticky palsta on jo dokumentissa).',
    v: 'V: vertailu: tavallinen pitkä sivu. Jos palkit eivät piiloudu tässäkään, Firefoxin asetus on pois: Asetukset > Mukauta > Piilota työkalupalkki vieritettäessä.'
  };
  var kpl = 'Pyyhkäise tekstiä ylöspäin keskeltä ja katso, piiloutuvatko selaimen palkit. Sivu ei käänny pyyhkäisystä, eikä tekstin kuulu liikkua (paitsi V:ssä). Alaspäin pyyhkäisy tuo palkit takaisin. ';
  var t = '';
  for (var i = 0; i < 40; i++) t += '<p>' + (i + 1) + '. ' + kpl + kpl + '</p>';
  document.getElementById('teksti').innerHTML = t;
  var html = document.documentElement, ohjaus = document.getElementById('ohjaus'), sivu = document.getElementById('sivu');
  var mL = document.getElementById('mitta-l'), mS = document.getElementById('mitta-s');
  var piiloutui = false, ihAlku = 0, ihMax = 0, maalaus = function () {};
  function paikka() {
    var h = ohjaus.getBoundingClientRect().height, m = html.className;
    html.style.setProperty('--ohjaus', h + 'px');
    // Kiinteän palstan yläreuna ohjauspalkin alle; H:n ja G:n sticky ja V:n virta saavat paikkansa CSS:stä.
    sivu.style.top = 'abcdef'.indexOf(m) >= 0 ? h + 'px' : '';
  }
  function paivita() {
    var l = mL.offsetHeight, s = mS.offsetHeight, ih = innerHeight;
    var vv = window.visualViewport ? Math.round(visualViewport.height) : '–';
    if (ih > ihMax) ihMax = ih;
    if (ihMax - ihAlku > 20 || (l - s > 20 && ih >= l - 2)) piiloutui = true;
    document.getElementById('lukema').textContent = 'vieritys ' + Math.round(scrollY) + ' / ' + (document.scrollingElement.scrollHeight - ih) +
      ' · ikkuna ' + ih + ' (alussa ' + ihAlku + ', suurin ' + ihMax + ') · vv ' + vv + ' · lvh ' + l + ' · svh ' + s;
    var tu = document.getElementById('tulos');
    tu.textContent = piiloutui ? 'PIILOUTUI tällä muunnelmalla' : 'ei ole piiloutunut' + (l - s <= 20 ? ' (lvh = svh)' : '');
    tu.className = piiloutui ? 'kylla' : 'ei';
  }
  function valitse(m) {
    html.className = m; piiloutui = false;
    document.querySelectorAll('#napit button').forEach(function (b) { b.classList.toggle('valittu', b.dataset.m === m); });
    document.getElementById('kuvaus').textContent = KUVAUS[m];
    // Kuten luin.html: palstassa ei-passiivinen touchmove-kuuntelija (maalaus), joka ei estä mitään. E ja G: passiivinen.
    sivu.removeEventListener('touchmove', maalaus, { passive: false });
    sivu.removeEventListener('touchmove', maalaus, { passive: true });
    maalaus = function () {};
    sivu.addEventListener('touchmove', maalaus, { passive: m === 'e' || m === 'g' });
    scrollTo(0, 0); paikka();
    ihAlku = ihMax = innerHeight;
    paivita();
  }
  document.getElementById('napit').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) valitse(b.dataset.m); });
  addEventListener('scroll', paivita, { passive: true });
  addEventListener('resize', function () { paikka(); paivita(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', paivita);
  valitse('a');
})();
</script>
</body>
</html>
