<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Sanaselitys</title>
<link rel="icon" href="kuvakkeet/32.png" sizes="32x32">
<link rel="icon" href="kuvakkeet/kuvake.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="kuvakkeet/180.png">
<!--
  Sanaselitys omana sivunaan: lukimen selitysikkunan moottori (sanaselitys.js, LuinSana) ilman lukijaa, kirjoitetulle
  sanalle. Tekstin ympäristöä ei ole, joten kieli on tuntematon (kaikki kielet; kreikan kirjaimet tunnistetaan), ellei haun
  alussa ole kielikoodia ja kaksoispistettä (fi:, en: … LuinSana.NIMI): silloin haku on kuin sen kielen leipätekstissä.
  Haku osoitteessa: sanaselitys.html#fi:käsitteen (selaimen hakusanaksi: sanaselitys.html#%s). Haku vain lähetyksestä
  (Enter), ei kirjoittaessa. Kielivalikko rajaa haun ja selityksen yhteen kieleen (oletus kaikki kielet, ei muistia);
  kielet ovat lukemiston (sivustot.html) kielirivin kielet (käyttäjän päätös). Teema luin-asetuksista kuten muilla alasivuilla.
  Samalla haulla Tieteen termipankki (LuinSana.termit, vain tällä sivulla): löydetyt käsitteet ovat valitsimessa Wikisanakirjan
  osumien edellä, ja kielirajaus rajaa ne käsitteisiin, joissa haettu nimitys on sitä kieltä.
  Sanakirjavalikko (käyttäjän päätös: mitkä tahansa päälle ja pois, oletuksena Wiktionary ja Tieteen termipankki; valinta
  muistetaan tällä laitteella, luin-sanakirjat). Wiktionary ja termipankki ovat moottorin (sanaselitys.js) selitys; ilman
  Wiktionarya moottori ajaa pelkän termipankin (o.wikt false) ja termipankki saa perusmuodon päätesäännöistä. Muut (Logeion,
  Wörterbuchnetz, DPD, Köln) ovat sanakirjat.js:n osioita selityksen alla omin perusmuodoin; Wiktionaryn perusmuodot (o.selitetty)
  ovat niille lisäehdokkaita, ja Wiktionaryn linkistä siirtyminen hakee niistä uuden sanan.
-->
<script>
  try {
    var a = JSON.parse(localStorage.getItem('luin-asetukset') || 'null');
    var tumma = a ? a.teema === 'tumma' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.teema = tumma ? 'tumma' : 'vaalea';
  } catch (e) {}
</script>
<style>
  @font-face { font-family: Literata; src: url(fontit/literata.woff2) format("woff2");
    font-weight: 380 700; font-style: normal; font-display: swap; }
  @font-face { font-family: Literata; src: url(fontit/literata-kursiivi.woff2) format("woff2");
    font-weight: 380 700; font-style: italic; font-display: swap; }
  @font-face { font-family: Literata; src: url(fontit/literata-kreikka.woff2) format("woff2");
    font-weight: 380 700; font-style: normal; font-display: swap; unicode-range: U+0370-03FF; }
  @font-face { font-family: Literata; src: url(fontit/literata-kreikka-kursiivi.woff2) format("woff2");
    font-weight: 380 700; font-style: italic; font-display: swap; unicode-range: U+0370-03FF; }
  @font-face { font-family: Literata; src: url(fontit/literata-kreikka-laaja.woff2) format("woff2");
    font-weight: 380 700; font-style: normal; font-display: swap; unicode-range: U+1F00-1FFF; }
  @font-face { font-family: Literata; src: url(fontit/literata-kreikka-laaja-kursiivi.woff2) format("woff2");
    font-weight: 380 700; font-style: italic; font-display: swap; unicode-range: U+1F00-1FFF; }
  :root {
    --paperi: #faf5ea; --muste: #231c14; --harmaa: #67553f; --viiva: #cbb99c;
    --ruoste: #8c5426; --okra: #b07a16; --huomio: #74624a;
    --antiikva: Literata, Georgia, "Noto Serif", "Droid Serif", serif;
  }
  :root[data-teema="tumma"] {
    --paperi: #120e0b; --muste: #ebdfca; --harmaa: #b09b7e; --viiva: #4b3e2f;
    --ruoste: #b8794a; --okra: #d4a443; --huomio: #a69272;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paperi); color: var(--muste); font: 17px/1.55 var(--antiikva); overflow-wrap: break-word;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  main { flex: 1 0 auto; width: 100%; max-width: 34rem; margin: 0 auto; padding: 24px 16px 40px; }
  :focus-visible { outline: 2px solid var(--ruoste); outline-offset: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  h1 { font-weight: 400; font-size: 1.5rem; letter-spacing: .04em; margin: 0 0 14px; }

  /* Hakukenttä: pelkkä viiva alla, lähetysnappina sanaselityksen merkki (lambda ja linssi kuten lukimen valikossa). */
  form { display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid var(--viiva); }
  form:focus-within { border-bottom-color: var(--muste); }
  input { flex: 1 1 auto; min-width: 0; font: 1.25rem/1.4 var(--antiikva); color: var(--muste); background: none; border: 0;
    border-radius: 0; padding: 4px 0 5px; -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; }
  input::placeholder { color: var(--harmaa); opacity: .7; font-style: italic; }
  input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  button.selita { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 44px; height: 40px; margin-right: -9px;
    color: var(--muste); }
  button.selita svg { width: 22.5px; height: 20px; overflow: visible; }
  .vihje { margin: 12px 0 0; font-size: .86rem; line-height: 1.5; color: var(--harmaa); }
  /* Kielirajaus kentän alla: valikko napautettavana ruosteella, nuoli kuten Latomon valikoissa. Natiivi lista teeman väreissä. */
  .rajaus { display: flex; align-items: center; gap: .5em; margin: 2px 0 0; font-size: .86rem; color: var(--harmaa); }
  .rajaus label { font-style: italic; }
  .rajaus select { font: inherit; color: var(--ruoste); background-color: transparent; border: 0; border-radius: 0; margin: 0;
    padding: 0 16px 0 0; min-height: 36px; appearance: none; -webkit-appearance: none; cursor: pointer; color-scheme: light;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 4px top 55%, right 0 top 55%; background-size: 4px 4px; background-repeat: no-repeat; }
  :root[data-teema="tumma"] .rajaus select { color-scheme: dark; }
  .rajaus option { color: var(--muste); background-color: var(--paperi); }
  /* Valikon leveys valitun kielen mukaan (natiivi valikko on pisimmän vaihtoehdon levyinen): mitataan tästä. */
  .rajaus .mitta { position: absolute; visibility: hidden; white-space: pre; }
  .vihje i { color: var(--muste); }
  /* Sanakirjavalikko kielivalikon rinnalla: nappi kuin valikko (ruoste, nuoli), lista ponnahduksena napin alla. Valinnan merkki
     on asetusten kytkimen salmiakki. Ahtaalla rivi taittuu, ja lista on palstan levyinen. */
  .rajaus { flex-wrap: wrap; column-gap: .5em; row-gap: 0; }
  .rajaus select { margin-right: .4em; }
  .rajaus .sk-osa-valinta { display: inline-flex; align-items: center; gap: .5em; }
  .rajaus .sk-osa-valinta span.n { font-style: italic; }
  .rajaus button#sanakirjat, .sk-valikko button { -webkit-tap-highlight-color: transparent; }
  .rajaus button#sanakirjat { font: inherit; color: var(--ruoste); min-height: 36px; padding: 0 16px 0 0; text-align: left;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 4px top 55%, right 0 top 55%; background-size: 4px 4px; background-repeat: no-repeat; }
  main { position: relative; }
  .sk-valikko { position: absolute; z-index: 5; width: min(22rem, calc(100% - 32px)); margin: 0; padding: 5px 0; background: var(--paperi);
    border: 1px solid var(--viiva); }
  .sk-valikko[hidden] { display: none; }
  .sk-valikko button { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 44px; padding: 7px 14px; text-align: left;
    font-size: .92rem; line-height: 1.35; color: var(--harmaa); }
  .sk-valikko button[aria-pressed="true"] { color: var(--muste); }
  .sk-valikko button[aria-pressed="false"] { opacity: .6; }
  .sk-valikko button[aria-disabled="true"] { cursor: default; }
  .sk-valikko svg { flex: 0 0 auto; width: 9px; height: 12.4px; margin-top: .32em; overflow: visible; }
  .sk-valikko .sal-ulko { fill: none; stroke: currentColor; stroke-width: .9; }
  .sk-valikko .sal-sisa { fill: none; }
  .sk-valikko button[aria-pressed="true"] .sal-sisa { fill: currentColor; }
  .sk-valikko .vk-kuv { display: block; margin-top: 1px; font-size: .84em; font-style: italic; color: var(--harmaa); }

  /* Selitys: lukimen selitysikkunan (.valikko.sanakirja) säännöt ilman kehystä. Ikkunan rem-koot ovat tässä em:einä suhteessa
     ikkunan .9rem:iin, joten suhteet pysyvät, vaikka koko on suurempi; pikselimitat (linssi, raksi) ennallaan. */
  #selitys { position: relative; margin-top: 22px; font-size: 1.05rem; line-height: 1.5; --sk-raksi: 28.5px; --sk-raksi-r: -.4px; }
  #selitys[hidden] { display: none; }
  #selitys .sk-ots { display: flex; align-items: baseline; gap: 12px; font-size: 1.167em; font-style: italic; margin-bottom: 5px;
    padding-right: var(--sk-raksi); }
  #selitys .sk-o { min-width: 0; overflow-wrap: anywhere; }
  #selitys .sk-kieli { margin-top: 9px; font-size: .867em; letter-spacing: .06em; text-transform: uppercase; color: var(--harmaa); }
  #selitys .sk-ol { margin: 1px 0 0; padding-left: 1.35em; }
  #selitys .sk-ol li { margin: 2px 0; }
  #selitys button.sk-sana, #selitys button.sk-vaihto { display: inline; text-align: inherit; color: var(--ruoste);
    text-decoration: underline; text-decoration-color: var(--viiva); text-underline-offset: 3px; }
  #selitys .sk-tieto { margin-top: 6px; color: var(--harmaa); }
  #selitys button.sk-sulje { position: absolute; top: 0; right: 0; width: 44px; height: 42px; color: var(--muste); }
  /* Raksi kuten ikkunassa, mutta ikkunan 11 px:n yläreunus puuttuu: ΛΟΓΟΣ-rivillä musteen keskellä (sivun ΛΟΓΟΣ on ikkunan suurempi), ilman sitä sanan peruslinjalla. */
  #selitys button.sk-sulje svg { position: absolute; right: var(--sk-raksi-r); top: 14px; width: 10px; height: 10px;
    stroke: currentColor; stroke-width: 1.2; fill: none; }
  #selitys.sk-logos-nak button.sk-sulje svg { top: 3.75px; }
  #selitys .sk-huom { margin-top: 6px; font-size: .889em; font-style: italic; color: var(--harmaa); line-height: 1.4; }
  #selitys .sk-varo { display: flex; align-items: center; gap: 9px; margin-top: 8px; font-size: .911em; line-height: 1.4; }
  #selitys .sk-varo svg { flex: 0 0 auto; width: 24px; height: 24px; }
  #selitys .sk-varo b { font-weight: 600; letter-spacing: .03em; }
  #selitys .sk-alaots { display: flex; align-items: baseline; margin-top: 12px; font-size: 1.111em; font-style: italic; }
  #selitys .sk-vaihdot { margin: 6px 0 0; padding: 0; list-style: none; }
  #selitys .sk-vaihdot li { display: flex; align-items: baseline; margin: 5px 0; }
  #selitys .sk-vaihdot button.sk-vaihto { font-size: 1.111em; font-style: italic; }
  #selitys .sk-vk { margin-left: 8px; font-size: .822em; letter-spacing: .04em; color: var(--harmaa); }
  #selitys .sk-ala { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; }
  #selitys a.sk-lisa { display: inline-flex; align-self: center; margin: -8px -8px -8px auto; padding: 8px; line-height: 0; text-decoration: none; }
  #selitys a.sk-lisa svg { width: 10.5px; height: 10.5px; fill: none; overflow: visible; }
  #selitys a.sk-lisa .plus { stroke: var(--ruoste); stroke-width: 1.3; }
  #selitys .sk-lahde { font-size: .711em; letter-spacing: .02em; color: var(--huomio); color: color-mix(in srgb, var(--harmaa) 55%, var(--viiva)); }
  #selitys .sk-ety-nappi { display: inline; }
  #selitys button.sk-ety { display: inline-block; position: relative; margin: 0 0 0 3px; line-height: 0; vertical-align: baseline; }
  #selitys button.sk-ety::after { content: ''; position: absolute; inset: -9px -10px -6px -3px; }
  #selitys button.sk-ety svg { width: 15.1px; height: 15.15px; vertical-align: -6.75px; overflow: visible; fill: none; }
  #selitys button.sk-ety .linssi, #selitys button.sk-ety .e { stroke: var(--ruoste); }
  #selitys button.sk-ety[aria-pressed="true"] .linssi, #selitys button.sk-ety[aria-pressed="true"] .e { stroke: var(--muste); }
  #selitys .sk-osa { display: block; font-size: .8em; letter-spacing: .26em; line-height: 1.3; text-align: left;
    color: var(--harmaa); color: color-mix(in srgb, var(--harmaa) 72%, var(--viiva)); }
  #selitys button.sk-osa[hidden] { display: none; }
  #selitys .sk-logos { margin: 0 0 8px; padding-right: var(--sk-raksi); }
  #selitys .sk-muoto { margin-top: 10px; font-size: .889em; line-height: 1.4; padding-left: .9em; font-style: italic; color: var(--harmaa); }
  #selitys .sk-ety-laatikko { margin-top: 11px; padding: 4px 10px 11px; border: 1px solid var(--viiva); }
  #selitys .sk-ety-ots { display: flex; align-items: center; }
  #selitys button.sk-ety-sulje { position: relative; margin-left: auto; width: 30px; height: 24px; margin-right: -9px; color: var(--harmaa); }
  #selitys button.sk-ety-sulje svg { position: absolute; right: 9px; top: 8px; width: 8px; height: 8px; stroke: currentColor; stroke-width: 1.1; fill: none; }
  #selitys .sk-ety-runko { margin-top: 6px; }
  #selitys .sk-ety-laatikko .sk-kieli { margin-top: 6px; }
  #selitys .sk-ety-p { margin: 4px 0 0; }
  #selitys .sk-ety-li { padding-left: 1em; text-indent: -.7em; }
  #selitys .sk-ety-li::before { content: '· '; color: var(--harmaa); }
  #selitys .sk-ety-laatikko .sk-tieto, #selitys .sk-ety-laatikko .sk-huom { margin: 4px 0 0; }
  /* Termiselityksen vastineet: kieli harmaalla kursiivilla, sanat napautettavina (Wikisanakirjan selitys). */
  #selitys .sk-vast { margin-top: 2px; }
  #selitys .sk-vrivi { margin: 3px 0; padding-left: 1em; text-indent: -1em; }
  #selitys .sk-vkieli { font-size: .889em; font-style: italic; color: var(--harmaa); margin-right: .35em; }
  /* Muut sanakirjat selityksen alla, kukin omana osionaan: nimi kuten ΛΟΓΟΣ (pieni, haalea, väljästi harvennettu), lähde ja
     plussa kuten Wiktionaryn. Avattavat sanakirjat ovat ruostetta; avattu sisältö sisennettynä hiusviivan vieressä. */
  #selitys section.sx { margin-top: 26px; }
  #selitys section.sx[hidden] { display: none; }
  #selitys .sx-nimi { font-size: .8em; letter-spacing: .26em; line-height: 1.3; text-transform: uppercase;
    color: var(--harmaa); color: color-mix(in srgb, var(--harmaa) 72%, var(--viiva)); }
  #selitys .sx-ots { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 10px; margin-top: 7px; font-size: 1.111em; font-style: italic; }
  #selitys .sx-o { min-width: 0; overflow-wrap: anywhere; }
  #selitys .sx-p { margin: 4px 0 0; }
  #selitys .sx-pieni { font-size: .889em; color: var(--harmaa); }
  #selitys .sx-muoto { margin-top: 4px; font-size: .889em; line-height: 1.4; padding-left: .9em; font-style: italic; color: var(--harmaa); }
  #selitys .sx-vk { font-size: .78em; letter-spacing: .06em; text-transform: uppercase; color: var(--harmaa); }
  #selitys .sx-vali { color: var(--harmaa); }
  #selitys button.sx-auki { display: inline; text-align: inherit; color: var(--ruoste);
    text-decoration: underline; text-decoration-color: var(--viiva); text-underline-offset: 3px; }
  #selitys button.sx-auki { font-style: italic; }
  #selitys button.sx-auki[aria-expanded="true"] { color: var(--muste); }
  #selitys .sx-kirjat { margin-top: 6px; line-height: 1.75; }
  #selitys .sx-kirjat button.sx-auki { font-style: normal; }
  #selitys .sx-kirja { white-space: nowrap; }
  #selitys .sx-sisus { margin: 8px 0 10px; padding-left: .9em; border-left: 1px solid var(--viiva); }
  #selitys .sx-sisus[hidden] { display: none; }
  #selitys .sx-sisus > .sx-p:first-child, #selitys .sx-sisalto > .sx-p:first-child { margin-top: 0; }
  #selitys a.sx-ulos { color: var(--ruoste); text-decoration-color: var(--viiva); text-underline-offset: 3px; }
  #selitys .sx-ala { display: flex; align-items: baseline; gap: 12px; margin-top: 8px; }
  #selitys .sx-lahde { font-size: .711em; letter-spacing: .02em; color: var(--huomio); color: color-mix(in srgb, var(--harmaa) 55%, var(--viiva)); }
  #selitys a.sx-lisa { display: inline-flex; align-self: center; margin: -8px -8px -8px auto; padding: 8px; line-height: 0; text-decoration: none; }
  #selitys a.sx-lisa svg { width: 10.5px; height: 10.5px; fill: none; overflow: visible; }
  #selitys a.sx-lisa .plus { stroke: var(--ruoste); stroke-width: 1.3; }
  #selitys .sx-ei { margin-top: 24px; font-size: .889em; font-style: italic; color: var(--harmaa); line-height: 1.4; }
  #selitys .sx-ei:empty { display: none; }
  /* Ilman moottoria (Wiktionary ja termipankki pois) kehyksestä jää otsikko, raksi ja tila; lähderivi on osioissa. */
  #selitys.sx-oma .sk-ala { display: none; }
  #selitys.sx-oma .sk-runko:empty { display: none; }
  @media (hover: hover) {
    #selitys .sk-vaihdot li:hover button.sk-vaihto { text-decoration-color: var(--ruoste); }
    #selitys button.sk-ety:hover .e { stroke: var(--muste); }
    #selitys button.sk-ety-sulje:hover { color: var(--muste); }
  }

  .foot { margin: 0; padding: 0 16px 22px; text-align: center; color: var(--harmaa); font-size: .64rem; letter-spacing: .16em; }
  .foot svg { width: 1.4em; height: 1.1em; vertical-align: -.2em; margin-right: .15em; overflow: visible; fill: currentColor; }
  .foot .k { fill: none; stroke: currentColor; stroke-width: 58; }
</style>
</head>
<body>
<main>
  <h1>Sanaselitys</h1>
  <form id="haku" role="search" autocomplete="off">
    <input id="sana" type="search" aria-label="Sana tai ilmaus" placeholder="sana tai ilmaus" autofocus
      autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button type="submit" class="selita" aria-label="Selitä" title="Selitä"><svg viewBox="3.6 0 22.5 20" fill="none" aria-hidden="true"><path d="M4.6 3.6C6.6 3.4 7.7 4.4 8.7 6.6L13.4 16.6C13.9 17.6 14.6 17.9 15.6 17.5M10.6 10.3L5.4 17.6" stroke="currentColor" stroke-width="1.5"/><g stroke="var(--ruoste)"><circle cx="18.19" cy="3.69" r="6" stroke-width="1.15"/><path d="M15.01 8.78L9.5 17.6" stroke-width="1.5"/></g></svg></button>
  </form>
  <p class="rajaus"><label for="kieli">kieli</label><select id="kieli" autocomplete="off">
    <option value="">kaikki kielet</option>
    <option value="en">englanti</option>
    <option value="es">espanja</option>
    <option value="it">italia</option>
    <option value="grc,el">kreikka</option>
    <option value="la">latina</option>
    <option value="lt">liettua</option>
    <option value="fr">ranska</option>
    <option value="sv">ruotsi</option>
    <option value="de">saksa</option>
    <option value="fi">suomi</option>
    <option value="da">tanska</option>
  </select><span class="mitta" id="kieli-mitta" aria-hidden="true"></span><span class="sk-osa-valinta"><span class="n" id="sanakirjat-n">sanakirjat</span><button
    type="button" id="sanakirjat" aria-haspopup="true" aria-expanded="false" aria-controls="sanakirjat-lista" aria-labelledby="sanakirjat-n sanakirjat"></button></span></p>
  <div class="sk-valikko" id="sanakirjat-lista" role="group" aria-label="Sanakirjat" hidden></div>
  <p class="vihje" id="vihje">Kielikoodi ja kaksoispiste alkuun, niin sitä kieltä haetaan ensin: <i>fi: käsitteen</i>, <i>en: running</i>
    (myös la, grc, el, de, fr, sv, lt, es, it ja da).</p>
  <section id="selitys" hidden></section>
</main>

<script>
(function () {
  'use strict';
  var S = window.LuinSana, SK = window.LuinSanakirjat, lomake = document.getElementById('haku'), kentta = document.getElementById('sana'),
    tulos = document.getElementById('selitys'), vihje = document.getElementById('vihje'), valikko = document.getElementById('kieli'), nyt = null;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
  // Kielirajauksen nimi genetiivinä (ei löytynyt -viesti: Latinan sanaa ei löytynyt …); arvo on Wikisanakirjan kielikoodit.
  var RAJAUS_NIMI = { en: 'englannin', es: 'espanjan', it: 'italian', 'grc,el': 'kreikan', la: 'latinan', lt: 'liettuan', fr: 'ranskan',
    sv: 'ruotsin', de: 'saksan', fi: 'suomen', da: 'tanskan' };
  // Sama rajaus termipankin kielinimin (haetun nimityksen kieli).
  var RAJAUS_TP = { en: 'englanti', es: 'espanja', it: 'italia', 'grc,el': 'kreikka', la: 'latina', lt: 'liettua', fr: 'ranska',
    sv: 'ruotsi', de: 'saksa', fi: 'suomi', da: 'tanska' };
  // Oletus aina kaikki kielet (selain voi palauttaa lomakkeen arvon uudelleenlatauksessa).
  valikko.value = '';
  var mitta = document.getElementById('kieli-mitta');
  function mitoita() {
    mitta.textContent = valikko.selectedOptions[0].textContent;
    valikko.style.width = Math.ceil(mitta.getBoundingClientRect().width) + 16 + 'px';
  }
  mitoita();
  if (document.fonts) document.fonts.ready.then(mitoita);
  // Kosketusnäyttö kuten lukimessa (hover: none on välttämätön: Booxin Firefox ei täytä pointer: coarse -ehtoa).
  var KOSKETUS = !!(window.matchMedia && matchMedia('(pointer: coarse), (hover: none)').matches);

  /* ---------- Sanakirjavalikko ----------
     Käyttäjän päätös: mitkä tahansa päälle ja pois, oletuksena Wiktionary ja Tieteen termipankki. Valinta muistetaan tällä
     laitteella (luin-sanakirjat); viimeistä päällä olevaa ei voi ottaa pois. Muutos hakee näkyvän selityksen uudelleen, kun
     lista sulkeutuu (ei joka napautuksella). Listan ohi napautus vain sulkee sen (Luinin sääntö). */
  var SK_AVAIN = 'luin-sanakirjat', OLETUS = SK.LAHTEET.filter(function (l) { return l.oletus; }).map(function (l) { return l.id; });
  var SAL = '<svg viewBox="0 0 8 11" aria-hidden="true"><path class="sal-ulko" d="M4 .9L7.2 5.5L4 10.1L.8 5.5Z"/><path class="sal-sisa" d="M4 3.2L5.6 5.5L4 7.8L2.4 5.5Z"/></svg>';
  var paalla = (function () {
    try {
      var a = JSON.parse(localStorage.getItem(SK_AVAIN) || 'null');
      if (Array.isArray(a)) { a = SK.LAHTEET.map(function (l) { return l.id; }).filter(function (id) { return a.indexOf(id) >= 0; }); if (a.length) return a; }
    } catch (e) {}
    return OLETUS.slice();
  })();
  var skNappi = document.getElementById('sanakirjat'), skLista = document.getElementById('sanakirjat-lista'), skAlussa = '';
  function skNimi() {
    var n = paalla.map(function (id) { var l = SK.lahde(id); return l.lyhyt || l.nimi; });
    skNappi.textContent = n.length <= 2 ? n.join(', ') : n.length + ' sanakirjaa';
  }
  function skPiirra() {
    skLista.innerHTML = SK.LAHTEET.map(function (l) {
      var on = paalla.indexOf(l.id) >= 0, viimeinen = on && paalla.length === 1;
      return '<button type="button" data-l="' + l.id + '" aria-pressed="' + on + '"' + (viimeinen ? ' aria-disabled="true"' : '') + '>' + SAL +
        '<span><span class="vk-nimi">' + esc(l.nimi) + '</span><span class="vk-kuv">' + esc(l.kuvaus) + '</span></span></button>';
    }).join('');
    skNimi();
  }
  function skAuki() { return !skLista.hidden; }
  function skAvaa() {
    skAlussa = paalla.join();
    skPiirra();
    skLista.hidden = false;
    skNappi.setAttribute('aria-expanded', 'true');
    // Napin alle sen vasemmasta laidasta; jos ei mahdu, ikkunan oikeaan laitaan 16 px:n päähän (kapealla palstan levyinen).
    var m = skLista.offsetParent.getBoundingClientRect(), b = skNappi.getBoundingClientRect(), lev = skLista.offsetWidth;
    skLista.style.top = Math.round(b.bottom - m.top) + 'px';
    skLista.style.left = Math.round(Math.max(16, Math.min(b.left, document.documentElement.clientWidth - 16 - lev)) - m.left) + 'px';
  }
  function skSulje(fokus) {
    if (!skAuki()) return;
    skLista.hidden = true;
    skNappi.setAttribute('aria-expanded', 'false');
    if (fokus) skNappi.focus();
    if (paalla.join() !== skAlussa) {
      try { localStorage.setItem(SK_AVAIN, JSON.stringify(paalla)); } catch (e) {}
      if (!tulos.hidden && kentta.value.trim()) laheta(true);
    }
  }
  skNappi.addEventListener('click', function () { if (skAuki()) skSulje(); else skAvaa(); });
  skLista.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-l]');
    if (!b || b.getAttribute('aria-disabled') === 'true') return;
    var id = b.dataset.l, i = paalla.indexOf(id);
    if (i >= 0) paalla.splice(i, 1); else paalla.push(id);
    paalla = SK.LAHTEET.map(function (l) { return l.id; }).filter(function (x) { return paalla.indexOf(x) >= 0; });
    skPiirra();
    var uusi = skLista.querySelector('button[data-l="' + id + '"]');
    if (uusi) uusi.focus();
  });
  document.addEventListener('click', function (e) {
    if (!skAuki() || skLista.contains(e.target) || skNappi.contains(e.target)) return;
    if (e.isTrusted) { e.preventDefault(); e.stopPropagation(); }
    skSulje();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && skAuki()) { e.preventDefault(); skSulje(true); } });
  skPiirra();

  // Kielikoodi ja kaksoispiste alussa (fi:, en: … vain LuinSana.NIMI:n kielet). Ilman sitä kieli on tuntematon, paitsi
  // kreikan kirjaimilla: polytoninen merkintä on muinaiskreikkaa, muu nykykreikkaa (ketju hakee molemmista).
  function jasenna(raaka) {
    var m = /^\s*([a-z]{2,3})\s*:\s*([\s\S]*)$/i.exec(raaka), k = m ? m[1].toLowerCase() : '';
    var kieli = S.NIMI.hasOwnProperty(k) ? k : '', haku = S.hakusana(kieli ? m[2] : raaka);
    if (!kieli && /\p{Script=Greek}/u.test(haku)) kieli = /[̀̓̔͂ͅ]/.test(haku.normalize('NFD')) ? 'grc' : 'el';
    return { kieli: kieli, haku: haku };
  }
  function tyhjenna() {
    nyt = null; muut = null; muutVuoro++; tulos.hidden = true; tulos.innerHTML = ''; tulos.className = ''; vihje.hidden = false;
  }

  /* ---------- Muut sanakirjat ----------
     muut: tämän haun tila. sanat ovat ehdokkaat kaikille lähteille: haettu sana ja Wiktionaryn perusmuodot (o.selitetty).
     Wiktionaryn linkistä tai otsikosta siirtyminen (siirto) vaihtaa sanan kokonaan. Lähteet haetaan rinnakkain, osiot ovat
     kiinteässä järjestyksessä, ja osio piirretään uudelleen vain, kun sen tulos vaihtuu. Ei osumaa -rivi tulee vasta, kun
     kaikki (myös Wiktionary) ovat valmiita, jottei se välähdä perusmuodon odotuksen ajan. */
  var muut = null, muutVuoro = 0, siirto = false;
  var PLUS = '<svg viewBox="6.75 6.75 10.5 10.5" aria-hidden="true"><path class="plus" d="M12 7.4V16.6M7.4 12H16.6"/></svg>';
  function muutLahteet(sana, ymp) {
    return SK.LAHTEET.filter(function (l) { return paalla.indexOf(l.id) >= 0 && SK.sopii(l.id, sana, ymp); }).map(function (l) { return l.id; });
  }
  function osioHtml(id, r) {
    var L = SK.lahde(id);
    return '<div class="sx-nimi">' + esc(L.otsake) + '</div>' + r.html + '<div class="sx-ala"><span class="sx-lahde">' + esc(L.lahde) + '</span>' +
      (r.linkki ? '<a class="sx-lisa" href="' + esc(r.linkki) + '" title="' + esc(r.otsikko) + '" aria-label="' + esc(r.otsikko) + '">' + PLUS + '</a>' : '') + '</div>';
  }
  function nimet(ids) { return ids.map(function (id) { return SK.lahde(id).nimi; }).join(', '); }
  function paivitaTila(m) {
    var alue = tulos.querySelector('.sx-muut');
    if (!alue || muut !== m) return;
    var tila = function (t) { return m.lahteet.filter(function (id) { return m.tila[id] === t; }); };
    var kesken = tila('haku').length > 0, ei = tila('ei'), virhe = tila('virhe'), osumia = tila('osuma').length;
    var rivi = alue.querySelector('.sx-ei');
    if (!m.moottori) {
      // Ilman moottoria (Wiktionary ja termipankki pois) kehyksen runko kertoo tilan.
      var runko = tulos.querySelector('.sk-runko'), logos = tulos.querySelector('.sk-logos');
      if (runko) runko.innerHTML = kesken && !osumia ? '<div class="sk-tieto">Haetaan…</div>' : osumia ? '' :
        '<div class="sk-tieto">' + (!m.lahteet.length ? 'Valitut sanakirjat eivät kata tätä hakua.' :
          virhe.length && !ei.length ? 'Haku ei onnistunut. Onko verkkoyhteys päällä?' : 'Sanaa ei löytynyt valituista sanakirjoista.') + '</div>';
      if (logos) { logos.hidden = !osumia; tulos.classList.toggle('sk-logos-nak', !!osumia); }
      if (!osumia) { rivi.textContent = ''; return; }
    }
    rivi.textContent = kesken || !m.valmis ? '' : (ei.length ? 'Ei osumaa: ' + nimet(ei) + '.' : '') +
      (virhe.length ? (ei.length ? ' ' : '') + 'Haku ei onnistunut: ' + nimet(virhe) + '. Onko verkkoyhteys päällä?' : '');
  }
  function ajaMuut() {
    var m = muut, v = ++muutVuoro, alue = tulos.querySelector('.sx-muut');
    if (!m || !alue) return;
    var olemassa = {};
    [].forEach.call(alue.querySelectorAll('section.sx'), function (sec) { if (m.lahteet.indexOf(sec.dataset.l) < 0) sec.remove(); else olemassa[sec.dataset.l] = sec; });
    var rivi = alue.querySelector('.sx-ei');
    if (!rivi) { rivi = document.createElement('div'); rivi.className = 'sx-ei'; alue.appendChild(rivi); }
    m.lahteet.forEach(function (id) {
      if (olemassa[id]) { alue.insertBefore(olemassa[id], rivi); return; }
      var sec = document.createElement('section');
      sec.className = 'sx'; sec.dataset.l = id; sec.hidden = true;
      alue.insertBefore(sec, rivi);
    });
    m.tila = {};
    m.lahteet.forEach(function (id) { m.tila[id] = 'haku'; });
    paivitaTila(m);
    m.lahteet.forEach(function (id) {
      var sec = alue.querySelector('section.sx[data-l="' + id + '"]');
      SK.hae(id, m.sanat, m.ymp).then(function (r) {
        if (v !== muutVuoro || muut !== m) return;
        if (r) {
          if (sec.dataset.avain !== r.avain) {
            sec.innerHTML = osioHtml(id, r); sec.dataset.avain = r.avain;
            var b = r.auki && sec.querySelector('button.sx-auki');
            if (b) SK.avaa(b);
          }
          sec.hidden = false; m.tila[id] = 'osuma';
        } else { sec.hidden = true; sec.innerHTML = ''; delete sec.dataset.avain; m.tila[id] = 'ei'; }
      }, function () {
        if (v !== muutVuoro || muut !== m) return;
        sec.hidden = true; sec.innerHTML = ''; delete sec.dataset.avain; m.tila[id] = 'virhe';
      }).then(function () { if (v === muutVuoro) paivitaTila(m); });
    });
  }
  // Moottorin haku valmis: Wiktionaryn sivut lisäehdokkaiksi (siirrossa uudeksi sanaksi); termipankki ja valitsin antavat [].
  function moottoriValmis(otsikot) {
    var m = muut;
    if (!m) return;
    m.valmis = true;
    var oli = siirto;
    siirto = false;
    if (oli && !otsikot.length) { paivitaTila(m); return; }
    var sanat = oli ? otsikot.slice() : uniq([m.haku].concat(otsikot));
    if (oli) m.haku = otsikot[0];
    var lahteet = muutLahteet(sanat[0], m.ymp);
    if (sanat.join('|') === m.sanat.join('|') && lahteet.join() === m.lahteet.join()) { paivitaTila(m); return; }
    m.sanat = sanat; m.lahteet = lahteet;
    ajaMuut();
  }
  /* Termipankki moottorille (LuinSana.termit). Wiktionaryn kanssa haku on kirjoitettu muoto kuten päähaarassa (Wiktionary hoitaa
     taivutuksen); ilman sitä termipankki saa ensin olemassa olevan perusmuodon päätesäännöistä (käsitteen → käsite), ja selitys
     kertoo haetun muodon (t.haettu; kopiot, koska termit ovat moottorin muistissa). */
  function termipankki(haku, kielet, wikt, ymp) {
    if (wikt) return S.termit(haku, kielet);
    return SK.tpPerusmuoto(haku, ymp).catch(function () { return ''; }).then(function (w) {
      return S.termit(w || haku, kielet).then(function (ts) {
        return w && w !== haku ? ts.map(function (t) { return Object.assign({}, t, { haettu: haku }); }) : ts;
      });
    });
  }

  // Kirjoitettu haku on kuin tekstin sana keskellä leipätekstiä: kirjainkoko on tarkoituksellinen (Kantin on erisnimi).
  // Kielirajauksessa haku on kuin rajauksen kielen leipätekstissä (kielikoodi kelpaa vain rajauksen sisältä), ja ketjusta jää
  // vain sen kieli; kreikkaan rajattu haku latinalaisin kirjaimin haetaan kreikkalaisin kirjaimin.
  function hae(raaka) {
    var q = jasenna(raaka);
    if (!q.haku) { tyhjenna(); return; }
    var rajaus = valikko.value ? { kielet: valikko.value.split(','), nimi: RAJAUS_NIMI[valikko.value] } : null;
    var kieli = rajaus && rajaus.kielet.indexOf(q.kieli) < 0 ? rajaus.kielet[0] : q.kieli;
    var wikt = paalla.indexOf('wiktionary') >= 0, tp = paalla.indexOf('termipankki') >= 0, ymp = { rajaus: rajaus ? rajaus.kielet : null, kieli: kieli };
    tulos.className = ''; tulos.innerHTML = S.kehys(q.haku, wikt ? q.haku : '') + '<div class="sx-muut"></div>'; tulos.hidden = false; vihje.hidden = true;
    muut = { haku: q.haku, ymp: ymp, sanat: [q.haku], lahteet: muutLahteet(q.haku, ymp), moottori: wikt || tp, wikt: wikt, valmis: !(wikt || tp), tila: {} };
    siirto = false;
    nyt = null;
    // Moottori ajaa Wiktionaryn ja termipankin (päähaaran valitsin); ilman Wiktionarya pelkän termipankin (o.wikt false, tyhjä ketju).
    if (wikt || tp) {
      var y = { kursiivi: false, lainaus: false, vip: false, oma: '', alku: false, kieli: kieli, symboli: S.symboli(q.haku), pikkusana: false };
      var monta = S.sanaLkm(q.haku) > 1, erisnimi = !monta && /^\p{Lu}/u.test(q.haku) && q.haku !== q.haku.toUpperCase(), ketju = [];
      if (wikt) {
        ketju = S.ketju(kieli, y, monta, erisnimi);
        if (rajaus) ketju = S.rajaa(ketju, rajaus.kielet, rajaus.kielet.indexOf('grc') >= 0 && !/\p{Script=Greek}/u.test(q.haku));
      }
      var oma = nyt = S.istunto({ juuri: tulos, haku: q.haku, y: y, ketju: ketju, kirjoitettu: true, rajaus: rajaus, wikt: wikt,
        termit: tp ? termipankki(q.haku, rajaus ? [RAJAUS_TP[valikko.value]] : null, wikt, ymp) : null,
        auki: function () { return nyt === oma && !tulos.hidden; }, selitetty: function (o) { if (nyt === oma) moottoriValmis(o); } });
      oma.aja();
    } else tulos.classList.add('sx-oma');
    ajaMuut();
  }
  // Osoitteen #-osa on haku sellaisenaan (sanaselitys.html#fi:käsitteen); + on väli kuten hakukoneiden osoitteissa.
  function osoitteesta() {
    try { return decodeURIComponent(location.hash.slice(1).replace(/\+/g, ' ')).trim(); } catch (e) { return ''; }
  }
  function osoitteeseen(v) {
    history.replaceState(null, '', v ? '#' + encodeURIComponent(v).replace(/%3A/gi, ':') : location.pathname + location.search);
  }

  // hiljaa: valikon muutos hakee uudelleen siirtämättä kohdistusta.
  function laheta(hiljaa) {
    var v = kentta.value.trim();
    osoitteeseen(v);
    hae(v);
    if (hiljaa === true) return;
    // Kosketusnäytöllä näppäimistö pois selityksen tieltä; hiirellä kenttä valituksi, jotta seuraavan sanan voi kirjoittaa heti.
    if (KOSKETUS) kentta.blur(); else kentta.select();
  }
  lomake.addEventListener('submit', function (e) { e.preventDefault(); laheta(); });
  // Kielen vaihto hakee näkyvän selityksen kentän sanan uudelleen (kuin Enter); ilman selitystä se odottaa lähetystä.
  valikko.addEventListener('change', function () { mitoita(); if (!tulos.hidden && kentta.value.trim()) laheta(); });
  tulos.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (!b) return;
    e.preventDefault();
    var k = b.dataset.k;
    if (k === 'sx-auki') { SK.avaa(b); return; }
    // Termipankin vastine on uusi haku (kielikoodin kanssa, kun Wiktionary tuntee kielen).
    if (k === 'sx-hae') { kentta.value = b.dataset.sana; laheta(); if (tulos.getBoundingClientRect().top < 0) tulos.scrollIntoView(); return; }
    if (k === 'sk-sulje') { tyhjenna(); kentta.value = ''; osoitteeseen(''); kentta.focus(); return; }
    // Ilman Wiktionarya ΛΟΓΟΣ ja ΕΤΥΜΟΝ ovat sivun hakuja (sama vitsi muissa sanakirjoissa); kenttä ei muutu kuten Wiktionaryssa.
    if (k === 'sk-osa' && !(muut && muut.wikt)) { hae(b.dataset.sana.split('|')[0]); return; }
    if (!nyt) return;
    siirto = k === 'sk-sana' || k === 'sk-osa';
    nyt.klikkaus(k, b);
    // Uusi sana (linkki, vaihtoehto, otsikko) korvaa selityksen: sen alku näkyviin.
    if (k !== 'sk-ety' && tulos.getBoundingClientRect().top < 0) tulos.scrollIntoView();
  });
  window.addEventListener('hashchange', function () {
    var v = osoitteesta();
    if (v === kentta.value.trim() && muut) return;
    kentta.value = v; hae(v);
  });

  var alku = osoitteesta();
  if (alku) {
    kentta.value = alku; hae(alku);
    if (KOSKETUS) kentta.blur();
  }
})();
</script>
