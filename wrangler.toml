name = "tusinasaa-worker"
main = "worker/src/index.js"
compatibility_date = "2025-09-28"
[observability]
enabled = true

[[kv_namespaces]]
binding = "LOCATIONS"
id = "033276b4df18419a8eb60a7d42a4efef"

# Coneelta Cännycälle: Latomon kirjoitukset postilaatikkoon (POST /api/luin) rajataan osoitetta kohti.
# wrangler 3 -syntaksi (unsafe.bindings); period on 10 tai 60 sekuntia.
[[unsafe.bindings]]
name = "LUIN_RAJA"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
