name = "tusinasaa-worker"
main = "worker/src/index.js"
compatibility_date = "2025-09-28"
[observability]
enabled = true

[[kv_namespaces]]
binding = "LOCATIONS"
id = "033276b4df18419a8eb60a7d42a4efef"

# Coneelta Cännycälle: Luinin ja Latomon kirjoitukset postilaatikkoon (POST /api/luin) kulkevat Durable Objectin
# laskurin kautta (osoitekohtainen minuuttiraja ja päiväraja, worker/src/index.js LuinRaja). SQLite-pohjainen, koska
# vain se toimii ilmaistasolla.
[[durable_objects.bindings]]
name = "LUIN_LASKURI"
class_name = "LuinRaja"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LuinRaja"]
