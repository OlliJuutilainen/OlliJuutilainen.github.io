<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />

  <!-- iOS: täysruutu + statuspalkki -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tusinasää" />
  <link rel="apple-touch-icon" href="./icons/tusinasaa-180.png" />

  <link rel="manifest" href="./manifest.webmanifest" />

  <title>Tusinasää</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background: #000; color: #fff; display: grid; place-items: center;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: contain;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #wrap { text-align: center; }
    #temp { font-size: clamp(64px, 16vw, 128px); line-height: 1; font-weight: 700; }
    #meta { opacity: .8; font-size: clamp(14px, 3.8vw, 16px); margin-top: .5rem; }
    #err  { color: #f66; font-size: 14px; margin-top: .75rem; display:none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="temp">—</div>
    <div id="meta">Tusinasää</div>
    <div id="err"></div>
  </div>
  <script>
    // Aiempi versio lähetti avaimen k ulkopuoliseen palveluun
    // ja tallensi t+k:n localStorageen. Nyt avain ei lähde minnekään: linkki ohjataan
    // tusinapaja.html:lle hash-fragmentissa, jossa purku tehdään selaimessa.
    try { localStorage.removeItem('ts_loc'); } catch {}

    function readParams() {
      const src = location.hash.replace(/^#/, '') || location.search.replace(/^\?/, '');
      const p = new URLSearchParams(src);
      const t = p.get('t');
      const k = p.get('k');
      return (t && k) ? { t, k } : null;
    }

    function showErr(msg) {
      const el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = 'block';
    }

    const loc = readParams();
    if (loc) {
      const frag = new URLSearchParams({ t: loc.t, k: loc.k }).toString();
      location.replace('./tusinapaja.html#' + frag);
    } else {
      showErr('Sijainti puuttuu. Avaa linkki, jossa on #t=...&k=...');
    }

    // SW rekisteröinti (sallittu, mutta ei vaadittu)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

  </script>
</body>
</html>
