<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>KEICK•WALK</title>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1b1b1a;
    --muted: #6d6b66;
    --dim: #c4c3bf;
    --off: #deddd9;
    --line: #dcd9d2;
    --soft: #efede8;
    --accent: #0a7f76;
    --dot: #a5a29b;
    --err-bg: #fbeae5;
    --err-fg: #7a2511;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --fg: #ebe9e4;
      --muted: #9b9890;
      --dim: #484743;
      --off: #302f2d;
      --line: #393834;
      --soft: #22221f;
      --accent: #1fb5a8;
      --dot: #6a6863;
      --err-bg: #3a1d14;
      --err-fg: #f6c2ad;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    position: relative;   /* yläkulman napit */
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 16px 48px;
  }
  h1 {
    font-size: 1.15rem;
    line-height: 1.25;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 20.8px;   /* otsikon alla oleva pysyy kohdallaan (oli 22 px 1,3 rem:n otsikolla) */
    padding-top: 6.7px;   /* perusviiva kuulokkeiden tyynyjen alareunassa, ks. .brand */
    text-align: left;
    /* Otsikko alkaa aina kuulokkeiden vierestä (käyttäjän sääntö 20.10.2026): jos ensimmäinen sana
       ei mahdu kuulokkeiden ja yläkulman nappien (.brand-space) väliin, se katkeaa väkisin kahdelle
       riville eikä siirry nappien alle. Muut sanat rivittyvät tavallisesti, koska anywhere katkaisee
       sanan vain, jos rivillä ei ole muuta katkaisukohtaa (mitattu Chromiumissa). */
    overflow-wrap: anywhere;
  }
  /* Valinnainen lisätieto otsikon alla (päivämäärä tms.). Ilman sitä riviä ei ole. */
  h1:has(+ .sub:not([hidden])) { margin-bottom: 3.3px; }
  .sub {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 0.8rem;
    font-style: italic;
    overflow-wrap: anywhere;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  button:focus-visible, .seek:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  svg { display: block; fill: currentColor; }
  .num { font-variant-numeric: tabular-nums; }

  /* --- Virheilmoitus --- */
  .error {
    background: var(--err-bg);
    color: var(--err-fg);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 20px;
  }
  .error p { margin: 0; }
  .error p + p { margin-top: 6px; font-size: 0.9rem; }

  /* --- Soitin --- */
  .now {
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.45em;
    margin: 0 0 4px;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .now .nr { color: var(--muted); }
  /* Ei-biisi (esim. [Intro]): myös otsikko himmeänä ja koko rivi kursiivina. */
  .now.pre { color: var(--muted); font-style: italic; }
  .seek {
    position: relative;
    height: 44px;
    touch-action: none;
    cursor: pointer;
    outline: none;
    border-radius: 4px;
  }
  .seek[aria-disabled="true"] { cursor: default; }
  /* Jana 2 px; soitettu osa tekstin värinen pisteineen, joten tumma ja vaalea eivät vaihda
     rooleja soittokohdassa (käyttäjän päätös 20.10.2026). */
  .bar {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 2px;
    margin-top: -1px;
    background: var(--line);
    border-radius: 1px;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--fg);
  }
  /* Biisin alku: tekstin värinen pallo janan keskellä (KEICK•WALK-logon aikajanan tapaan), ei-biisin
     alkua ei merkitä (käyttäjän päätös 20.10.2026). Soittokohdan jälkeen pallo on janan paksuinen,
     ohitettuna (.ohi) 4 px. Pallon ja janan paksuuden ero on parillinen (4 − 2 px), jotta pallo ylittää
     janan yhtä paljon ylä- ja alapuolella myös pikseleiksi pyöristettynä (mitattu). */
  .tick {
    position: absolute;
    top: 50%;
    width: 2px;
    height: 2px;
    margin: -1px 0 0 -1px;
    border-radius: 50%;
    background: var(--fg);
    pointer-events: none;
  }
  .tick.ohi { width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--fg); }
  .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--accent);   /* kuten KEICK•WALK-logon janan nuppi */
    pointer-events: none;
  }
  /* Janan loppu: tekstin värinen rengas kuten logossa. Kun soitto pysähtyy setin lopussa (.setti),
     rengas on keikkajanalla pysähdyskohdassa eli seuraavan setin alussa (renderTicks), ja janan
     jatko häipyy: sen päälle tulee renkaan keskeltä taustan värinen kaistale (.jatko), joka peittää
     myös jatkon pallot. Jatkoa voi silti napauttaa (hyppy seuraavaan settiin). */
  .loppu {
    position: absolute;
    top: 50%;
    left: 100%;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border: 2px solid var(--fg);
    border-radius: 50%;
    background: var(--bg);
    pointer-events: none;
    transition: left 0.15s;
  }
  .jatko {
    position: absolute;
    top: 50%;
    left: 100%;
    right: -2px;
    height: 6px;
    margin-top: -3px;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: left 0.15s, opacity 0.15s;
  }
  .seek.setti .jatko { opacity: 1; }
  .seek[aria-disabled="true"] .knob, .seek[aria-disabled="true"] .loppu,
  .seek[aria-disabled="true"] .jatko { display: none; }
  /* Aika janan alla: vasemmalla kohta, oikealla janan pituus. Jana on 44 px
     korkea ja viiva sen keskellä, joten rivi nostetaan lähemmäs viivaa. */
  .times {
    position: relative;
    display: flex;
    justify-content: space-between;
    margin-top: -10px;
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  /* Setti-asennossa janan pituuden tilalla on pysähdyskohdan aika keikan alusta renkaan alla
     keskellä (.setend, placeSetEnd). Ajat vaihtuvat ristiin häivyttäen renkaan liikkeen tahdissa. */
  #dur { transition: opacity 0.15s; }
  .times.setti #dur { opacity: 0; }
  .setend {
    position: absolute;
    top: 0;
    opacity: 0;
    pointer-events: none;
    transition: left 0.15s, opacity 0.15s;
  }
  .times.setti .setend { opacity: 1; }
  .ctls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 3px;
  }
  .ctl {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .ctl:disabled { opacity: 0.35; cursor: default; }
  .ctl svg { width: 22px; height: 22px; }
  .ctl.play {
    width: 56px;
    height: 56px;
    background: var(--fg);
    color: var(--bg);
  }
  .ctl.play svg { width: 26px; height: 26px; }
  .ctl.skip svg { width: 24px; height: 24px; }

  /* --- Kytkimet: janan mittakaava ja pysähdys setin lopussa --- */
  /* Kytkimet ovat nappien alla rinnakkain: vasemmalla janakytkin, oikealla
     setin kytkin. Yhden setin keikassa janakytkin on yksin keskellä.
     Leveys on kompromissi: janakytkimen keikka-sana alkaa hieman edellinen
     kappale -kuvakkeen vasemman reunan ulkopuolelta ja setti-sana päättyy
     yhtä paljon ennen seuraava kappale -kuvakkeen oikeaa reunaa (~5 px).
     Kuvakkeiden reunat ovat 119,5 px keskeltä; sanan ulkoreuna on
     leveys/4 + 22 px + sanan leveys (keikka ~31 px, setti ~20 px). */
  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
    width: 288px;
    max-width: 100%;
    margin: 10px auto 0;
  }
  .opts:has(#setopt[hidden]) #scaleopt { grid-column: 1 / -1; }
  #list { margin-top: 36px; }
  /* Kytkin keskellä, vaihtoehdot sen molemmin puolin ilman kehystä.
     Sarakkeet 1fr auto 1fr pitävät kytkimen keskellä tekstien pituudesta
     riippumatta. Toisella rivillä kytkimen alla on sen symboli. */
  .sw {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: 10px;
    min-height: 28px;
    color: var(--muted);
    font-size: 0.64rem;
    font-style: italic;
  }
  .sw .side {
    position: relative;
    min-height: 28px;
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: color 0.15s;
  }
  .sw .side:first-child { justify-content: flex-end; }
  /* Valittu puoli pysyy --muted-värisenä; valitsematon himmenee kohti
     taustaa (--off on 80 % matkasta --mutedista --bg:hen). */
  .sw:has(input:checked) .side[data-on="0"],
  .sw:has(input:not(:checked)) .side[data-on="1"] { color: var(--off); }
  .sw input {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    width: 24px;
    height: 14px;
    margin: 0;
    border-radius: 7px;
    background: none;
    box-shadow: inset 0 0 0 1px var(--muted);
    cursor: pointer;
  }
  /* Kytkin on tekstiä matalampi; ::before laajentaa kosketusalueen
     koko rivin korkuiseksi (28 px). */
  .sw input::before {
    content: "";
    position: absolute;
    inset: -7px -8px;
  }
  .sw input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.15s;
  }
  .sw input:checked::after { transform: translateX(10px); }
  /* Kytkin on ääriviiva ja tumma nuppi, samanlainen kummassakin
     asennossa; valinnan kertovat nupin paikka ja tekstien himmennys. */
  .sw input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Janakytkimen alla on pienoisjana: täytetty pallo alussa ja lopussa
     hyvin ohut rengas kuten aikajanassa (sen tausta peittää janan renkaan
     sisältä). Pallot ovat kytkimen levyisellä alueella: pallon vasen ja renkaan
     oikea reuna kytkimen reunojen kohdalla (käyttäjän valinta 20.10.2026). Jana on hieman
     alempana kuin rivin väli antaisi (kohti setin kytkimen kuulokkeiden
     keskikohtaa). Siirto on top-arvona, ettei rivi kasva. */
  .minijana {
    grid-row: 2;
    grid-column: 1 / -1;
    justify-self: center;
    width: 24.4px;
    height: 6px;
    margin-top: 1px;
    position: relative;
    top: 1.5px;
    fill: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
  }
  .minijana .bg { stroke: var(--dim); }
  .minijana .rengas { fill: var(--bg); stroke: currentColor; stroke-width: 0.6; }

  /* Natsa janakytkimen keikka-sanan vasemmalla puolella piilottaa kytkimet.
     Rako sanaan (18 px) on selvästi kytkimen ja tekstin väliä (10 px)
     suurempi. Natsa on keikka-puolen sisällä, jotta se pysyy sanan
     vieressä tekstin leveydestä riippumatta. Negatiivinen vasen marginaali
     (leveys + rako) pitää sen osuuden puolen leveydestä nollana, ettei
     kytkin siirry. Suljettuna vain natsa näkyy samalla paikalla, ja se
     kääntyy osoittamaan oikealle (▸). */
  .fold {
    position: relative;
    display: grid;
    place-items: center;
    margin: 0 18px 0 -25px;
    color: var(--muted);
  }
  .fold::before {
    content: "";
    position: absolute;
    inset: -12px -10px;
  }
  .fold svg {
    width: 7px;
    height: 3.5px;
    fill: none;
    stroke: currentColor;
    stroke-width: 0.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s;
  }
  .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opts.kiinni .fold svg { transform: rotate(-90deg); }
  .opts.kiinni .sw > *, .opts.kiinni #setopt { visibility: hidden; }
  .opts.kiinni .fold { visibility: visible; }
  .opts.kiinni .minijana, .opts.kiinni .minikuul { display: none; }
  /* Suljettuna lista nousee lähemmäs natsan riviä; natsa itse pysyy
     paikallaan, jotta sen voi avata samasta kohdasta. */
  .opts.kiinni + #list { margin-top: 12px; }

  /* Setin kytkimen alla ovat pienet harmaat KEICK•WALK-logon kuulokkeet
     (käyttäjän päätös 20.10.2026; aiemmin stop-merkki ja nuoli) entisen
     stop-merkin paikalla ja korkuisina. Ne himmenevät, kun soitetaan
     keikan loppuun. */
  .minikuul {
    grid-row: 2;
    grid-column: 2;
    justify-self: center;
    width: 8.321px;
    height: 8px;
    margin-top: 3px;
    overflow: visible;
    transition: color 0.15s;
  }
  #setopt:has(input:not(:checked)) .minikuul { color: var(--off); }

  /* --- Kappalelista --- */
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  li {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
  }
  .track {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 48px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 4px;
    text-align: left;
  }
  .track .n {
    flex: 0 0 auto;
    min-width: 1.6em;
    color: var(--muted);
    text-align: right;
  }
  .track .tt {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .track .st {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 0.9rem;
  }
  /* Soiva kappale on lihavoitu ja turkoosi (käyttäjän päätös 20.10.2026). */
  li[aria-current="true"] .track { font-weight: 600; }
  li[aria-current="true"] .track .tt { color: var(--accent); }
  /* Soivan kappaleen numeron paikalla ovat logon kuulokkeet (käyttäjän päätös 20.10.2026), oikeaan
     reunaan tasattuina kuten numerot: sangan yläreuna tekstin sisältöalueen yläreunassa ja
     tyynyjen alareuna perusviivalla. Koon ja paikan laskee
     markCurrent. viewBoxissa on 0,5 yksikön vara joka reunalla, koska Safari leikkasi oikean
     tyynyn reunan viewBoxin rajalla. */
  .track { position: relative; }
  li[aria-current="true"] .track .n { visibility: hidden; }
  .kuul { position: absolute; overflow: visible; fill: currentColor; }
  .kuul .t { fill: var(--accent); }
  /* Ei-biisi (x-rivi): "0. [Intro] 0:00", numerona 0, x tai -, koko rivi
     himmeä ja kursiivi, eikä lihavoidu soidessaankaan. Koot ja asettelu
     kuten muilla riveillä. */
  li.pre .track { font-style: italic; font-weight: 400; }
  li.pre .track .tt { color: var(--muted); }
  /* Setin otsikko (i), (ii) …: jokainen setti alkaa kuin oma listansa. */
  ol.sets { border-top: 0; }
  /* Setin kesto samaan sarakkeeseen kuin kappaleiden kestot: oikea
     reuna 4 px (.track) + 44 px (.copy) rivin reunasta. Summamerkki Σ:
     on keston edessä mutta DOM:ssa sen jälkeen (order), jotta se voidaan
     piilottaa, kun kestoa ei vielä tiedetä. */
  li.set {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 30px 48px 6px 4px;
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  li.set .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  li.set .len { flex: 0 0 auto; order: 2; opacity: 0.8; }
  li.set .sig {
    flex: 0 0 auto;
    order: 1;
    margin-right: -5px;
    font-size: 0.8em;
    opacity: 0.8;
    /* Pienempi merkki istuisi perusviivalla numeroita alempana; nostetaan
       sen keskikohta numeroiden keskikohdan tasalle. */
    position: relative;
    top: -0.1em;
  }
  li.set .len:empty + .sig { visibility: hidden; }
  li.set:first-child { padding-top: 0; }
  .copy {
    flex: 0 0 44px;
    min-height: 44px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .copy svg { width: 18px; height: 18px; }
  .copy.done { color: var(--accent); }
  @media (hover: hover) {
    /* Hiiren alla kappaleen nimi turkoosiksi, ei alleviivausta (käyttäjän päätös 20.10.2026);
       li mukana, jotta sääntö voittaa myös ei-biisin harmaan. */
    li .track:hover .tt { color: var(--accent); }
    .copy:hover { color: var(--fg); }
  }
  .loading { color: var(--muted); margin: 0; }

  /* Omat keikkani verkossa (sovelluksessa napit tuo silta.js). */
  /* Otsikolle varataan yläkulman nappien tila (verkossa ☰, sovelluksessa silta.js:n kolme nappia)
     vain ensimmäisellä rivillä kelluvalla .brand-space-laatikolla, joten pitkä nimi jatkuu nappien
     alla täysleveänä; tämä korvaa otsikon oikean reunuksen (myös silta.js:n main>h1 136px).
     Kuulokelogo oli tässä 20.10.2026 asti; nyt se on vasemmassa yläkulmassa (.brand). */
  .brand-space { float: right; width: 45px; height: 29px; }
  /* KEICK•WALK-logon kuulokkeet vasemmassa yläkulmassa (käyttäjän päätös 20.10.2026): logon
     kirjainten yläreuna (y 4) 5 px h1:n yläreunan alapuolella; sanka nousee siitä 1,2 yksikköä
     (viewBox y 2,8), jolloin lakipisteen viivan alareuna on kirjainten yläreunassa. Tyynyjen alareuna (y 20)
     ensimmäisen rivin perusviivalla (h1:n padding-top; käyttäjän päätös 20.10.2026, aiemmin tyynyjen keskellä).
     Mittakaava 1,0295 rem / 13,38 per viewBox-yksikkö on 1,45 rem:n otsikon versaalin korkeudesta;
     otsikko on nyt pienempi (1,15 rem, paino 400), joten sen versaali jää sangan alapuolelle. Omat keikkani -sivun logo
     (lista/keikat.html) on samassa mittakaavassa ja kohdassa, joten sen kuulokkeet ovat tasan näiden
     päällä. Otsikon ja lisätiedon rivit alkavat niin, että otsikon K:n mustereuna on logon k:n
     vasemmalla reunalla (x 25,88; Roboton K:n vasen sivuväli 0,0875 rem), ja lisätiedon x-korkeuden
     yläreuna on logon janan alareunassa (h1:n alamarginaali 3,3 px). Mitattu Robotolla.
     Otsikko alkaa aina ensimmäiseltä riviltä (ks. h1 overflow-wrap), joten paikka on kiinteä. */
  .brand { position: absolute; left: 16px; top: calc(33px - 1.0295rem / 13.38 * 1.2); width: calc(1.0295rem / 13.38 * 17.89); height: calc(1.0295rem / 13.38 * 17.2); overflow: visible; }
  .brand .t { fill: var(--accent); }
  main > h1, main > .sub { padding-left: calc(1.0295rem / 13.38 * 24.89 - 0.0875rem); }
  main.app .brand-space { width: 141px; }
  main.omat > h1, main.app > h1 { padding-right: 0; }
  #omat {
    position: absolute;
    top: 20px;
    right: 5px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  #omat svg { width: 22px; height: 22px; }
  #lista {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    z-index: 10;
  }
  html.lista, html.lista body { overflow: hidden; }
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <svg class="brand" viewBox="0.99 2.8 17.89 17.2" role="img" aria-label="KEICK•WALK"><path d="M3.61 17.38V9.725A6.325 6.325 0 0 1 16.26 9.725V17.38" fill="none" stroke="currentColor" stroke-width="1.2"/><circle class="t" cx="3.61" cy="17.38" r="2.62"/><circle class="t" cx="16.26" cy="17.38" r="2.62"/></svg>
  <div class="brand-space" aria-hidden="true"></div>
  <h1 id="title">KEICK•WALK</h1>
  <p class="sub" id="sub" hidden></p>

  <div id="app" hidden>
  <section aria-label="KEICK•WALK">
    <p class="now" id="now" aria-live="polite"></p>
    <div class="seek" id="seek" role="slider" tabindex="0"
         aria-label="Soittokohta" aria-valuemin="0" aria-valuemax="0"
         aria-valuenow="0" aria-valuetext="0:00" aria-disabled="true">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div id="ticks"></div>
      <div class="jatko" id="jatko"></div>
      <div class="loppu" id="loppu"></div>

    </div>
      <div class="times num"><span id="cur">0:00</span><span id="dur">–:––</span><span class="setend" id="setend" aria-hidden="true"></span></div>
    <div class="ctls">
      <button class="ctl" id="prev" type="button" aria-label="Edellinen kappale">

      </button>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 1 0 8-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v7L7.5 5z"/></svg>
      </button>
      <button class="ctl play" id="play" type="button" aria-label="Toista">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="icon-play"><path d="M7 4.5v15L20 12z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" id="icon-pause" hidden><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>
      </button>
      <button class="ctl skip" id="fwd" type="button" aria-label="15 sekuntia eteenpäin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a8 8 0 1 1-8-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v7L16.5 5z"/></svg>
      </button>
      <button class="ctl" id="next" type="button" aria-label="Seuraava kappale">

      </button>

  <!-- Kytkin keskellä, vaihtoehdot sen molemmin puolin. Vasen = pois. -->
  <div class="opts" id="opts">
    <div class="sw" id="scaleopt">
      <span class="side" data-on="0"><button class="fold" id="fold" type="button" aria-expanded="true" aria-label="Piilota kytkimet"><svg viewBox="0 0 7 3.5" aria-hidden="true"><path d="M.75.75l2.75 2 2.75-2"/></svg></button><span id="gigword">keikka</span></span>
      <input type="checkbox" role="switch" id="songscale" aria-label="Biisijana">

    </div>

      <span class="side" data-on="0">keikka</span>

      <svg class="minikuul" viewBox="0.99 2.8 17.89 17.2" aria-hidden="true"><path d="M3.61 17.38V9.725A6.325 6.325 0 0 1 16.26 9.725V17.38" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="3.61" cy="17.38" r="2.62"/><circle cx="16.26" cy="17.38" r="2.62"/></svg>
    </div>
  </div>

  <ol id="list" aria-label="Kappaleet"></ol>
  <p class="sr" id="status" aria-live="polite"></p>
  </div>

  <audio id="audio" preload="metadata"></audio>
</main>

<script>
(function () {
  "use strict";

  // Hyppynappien askel (s). Hyppy saa ylittää biisin rajan.
  var SKIP = 15;

  // Keikan tiedot (otsikko, mp3-linkki, biisilista) haetaan workerista.
  // Repossa ei ole yhtään keikkaa: tunnus kulkee osoitteen #-osassa,
  // esim. …/soitin/#k7f3qa2m tai kappaleeseen 3: …/soitin/#k7f3qa2m/3.
  // Jos keikassa on useampi setti, toisen setin kappale 3 on …/#k7f3qa2m/2/3.
  // Tiedot tallennetaan Keikkaloihtimella (soitin/uusi.html).
  // Kaveriversio (soitin/kayttoonotto.html): …/#k7f3qa2m@soitin.kaveri hakee keikan
  // toisen tilin workerista https://soitin.kaveri.workers.dev. Osoite rajataan
  // workers.dev-aliverkkotunnukseen, ja tiedot näytetään vain tekstinä.
  var API = "https://tusinasaa-worker.ollijuutilainen.workers.dev/api/gig";
  // Kappale: /3 tai /2/3; ei-biisi: /x1 tai /2/x1 (setin ensimmäinen ei-biisi).
  var HASH_RE = /^#([a-z0-9]{4,32})(?:@([a-z0-9-]{1,63}\.[a-z0-9-]{1,63}))?(?:\/(\d+|x\d+)(?:\/(\d+|x\d+))?)?$/i;

  var $ = function (id) { return document.getElementById(id); };
  var audio = $("audio");
  var els = {
    title: $("title"), error: $("error"), now: $("now"), seek: $("seek"),
    fill: $("fill"), ticks: $("ticks"), knob: $("knob"), loppu: $("loppu"), jatko: $("jatko"),
    times: document.querySelector(".times"), cur: $("cur"), dur: $("dur"), setend: $("setend"),
    play: $("play"), prev: $("prev"), next: $("next"), back: $("back"), fwd: $("fwd"),
    list: $("list"), setopt: $("setopt"), opts: $("opts"), fold: $("fold"), setonly: $("setonly"), songscale: $("songscale"),
    status: $("status"), iconPlay: $("icon-play"), iconPause: $("icon-pause")
  };

  // ---- Aikojen jäsennys ja muotoilu --------------------------------------

  function parseTime(s) {
    var m = /^\s*(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d+))?\s*$/.exec(String(s));
    if (!m) return NaN;
    var h = m[1] ? +m[1] : 0, min = +m[2], sec = +m[3];
    if (sec > 59 || (m[1] && min > 59)) return NaN;
    return h * 3600 + min * 60 + sec + (m[4] ? +("0." + m[4]) : 0);
  }

  function fmt(t, long) {
    if (!isFinite(t) || t < 0) t = 0;
    t = Math.floor(t);
    var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    var ss = (s < 10 ? "0" : "") + s;
    if (h || long) return h + ":" + (m < 10 ? "0" : "") + m + ":" + ss;
    return m + ":" + ss;
  }

  // Listan kestosarake: "mm:ss" tai "hh:mm:ss" (ryhmät: ks. renderLens).
  function fmtLen(t, long) {
    var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return (long ? p(h) + ":" : "") + p(m) + ":" + p(s);
  }

  // ---- Kappaleet --------------------------------------------------------

  var gig = null;      // { title, audio, tracks: [{ t, title }] } tai { title, files }
  var gigKey = "";
  var gigWorker = "";  // kaveriversion worker ("soitin.kaveri"), tyhjä = oletus
  var tracks = [];     // [{ start, title, set, n }]; ei-biisillä n = -1, x = järjestys setissä ja sym = 0, x tai -
  var sets = 1;
  var setInfo = [];    // [{ name, first }] setin numerolla 1… (indeksi 0 tyhjä)
  var showSets = false;
  var rows = [];       // kappaleiden li-elementit, tracks-järjestyksessä
  var setLens = [];    // setin otsikkorivin kestokentät
  var trackLens = [];  // kappalerivien kestokentät, tracks-järjestyksessä
  var heads = [];      // setin otsikkorivit: { li, first: ensimmäisen kappaleen indeksi }

  // Lisäominaisuus, kansiokeikka (Dropbox- tai Drive-kansio, ks. worker):
  // jokainen kappale on oma tiedostonsa. Tiedostot ladataan peräkkäin samaan audio-elementtiin, ja
  // kappaleiden alkuajat ovat tiedostojen kestojen summia, joten muu soitin
  // (jana, setit, hypyt, linkit) näkee yhden yhtenäisen keikan.
  // files = null tarkoittaa tavallista yhden tiedoston keikkaa.
  var files = null;    // [{ url, title, len, set, name }]
  var cur = 0;         // audio-elementissä oleva tiedosto

  // Keikka voi jakautua setteihin (biisilistan ---); kenttä set: true on
  // uuden setin ensimmäisessä kappaleessa ja name sen oma otsikko, esim. "(+)".
  // Numerointi alkaa joka setissä 1:stä. Ei-biisi (x-rivi, ks. xTitle) ei vie
  // numeroa; sen numeron paikalla on 0, x tai - (ks. markExtras).
  function num(i) { return tracks[i].x ? tracks[i].sym : tracks[i].n; }
  function isExtra(i) { return !!tracks[i].x; }
  // Kappaleen linkin ja hashin tunniste: "3" tai ei-biisillä "x1".
  function linkNum(i) { return tracks[i].x ? "x" + tracks[i].x : String(tracks[i].n); }
  function setName(k) { return setInfo[k].name || "(" + roman(k) + ")"; }
  // Kappaleen tunniste teksteihin (ref): "3" tai setteihin jaetussa "(ii) 3";
  // ei-biisillä numeron sijaan otsikko, esim. "(ii) [OUTRO]".
  // Lukitusnäytön otsikko: otsikko, tai otsikottomalla biisillä numero
  // ("3." tai setteihin jaetussa "(ii) – 3.").
  function nowText(i) {
    var tr = tracks[i];
    return tr.untitled ? (showSets ? setName(tr.set) + " – " : "") + num(i) + "." : tr.title;
  }
  // Nyt soi -kenttä: numero ja otsikko ("3. Otsikko" tai setteihin jaetussa
  // "(ii) 3. Otsikko"). Setti ja numero himmeinä;
  // otsikottomalla biisillä numero on itse otsikko eikä himmene.
  // Ei-biisillä ("0. [INTRO]") otsikko himmenee ja koko rivi on kursiivi. Sitovat
  // välilyönnit pitävät setin, numeron ja otsikon alun kiinni toisissaan.
  function renderNow(i) {
    var tr = tracks[i];
    var nr = document.createElement("span");
    nr.className = "nr";
    if (showSets) nr.textContent = setName(tr.set) + "\u00a0";
    var n = document.createTextNode(num(i) + ".");
    els.now.textContent = "";
    els.now.classList.toggle("pre", isExtra(i));
    els.now.appendChild(nr);
    if (tr.untitled) {
      els.now.appendChild(n);
    } else {
      nr.appendChild(n);
      els.now.appendChild(document.createTextNode("\u00a0" + tr.title));
    }
  }
  function ref(i) { return (showSets ? setName(tracks[i].set) + " " : "") + (tracks[i].x ? tracks[i].title : num(i)); }
  // Setin alku (s).
  function setStart(k) { return tracks[setInfo[k].first].start; }
  function roman(n) {
    var r = "", v = [40, 10, 9, 5, 4, 1], d = ["xl", "x", "ix", "v", "iv", "i"];
    for (var k = 0; k < v.length; k++) while (n >= v[k]) { r += d[k]; n -= v[k]; }
    return r;
  }

  // Jos ensimmäinen kappale alkaa myöhemmin kuin 0:00, alkuun lisätään
  // ei-biisi, jonka oletusotsikko on [INTRO]. Lisäys on vain näytössä, ei
  // tallennetussa keikassa. Setin otsikko siirtyy introlle.
  function withIntro(list) {
    var f = (list || [])[0];
    if (!f || !(parseTime(f.t) > 0)) return list;
    var intro = { t: "0:00", title: "[]" };
    if (f.name) intro.name = f.name;
    return [intro, { t: f.t, title: f.title }].concat(list.slice(1));
  }

  // Ei-biisi eli x-rivi: raita, joka ei ole varsinainen biisi, missä kohtaa
  // settiä tahansa. Biisilistassa nimi hakasulkeissa ("3:42 [Intro]") tai
  // alussa [x], [0] tai [-] ("3:42 [x]", "3:42 [0] Nimi"); Keikkaloihdin
  // tallentaa pelkän ajan muodossa "[]". Merkintä on otsikossa eikä omana
  // kenttänään, jotta workeria ei tarvitse päivittää (se päästää kappaleista
  // läpi vain t, title, set ja name). Palauttaa nimen ilman merkintää ja
  // hakasulkeita ("" = oletusotsikko) tai null, jos raita on biisi.
  var X_RE = /^\s*\[([x0\-–—])\]\s*(.*?)\s*$/i;
  function xTitle(s) {
    s = String(s || "");
    var m = X_RE.exec(s);
    if (m) return m[2].replace(/^\[(.*)\]$/, "$1").trim();
    m = /^\s*\[(.*)\]\s*$/.exec(s);
    return m ? m[1].trim() : null;
  }
  // Ei-biisin oma numeromerkki (x, 0 tai -) tai "", jos sitä ei ole annettu.
  function xSym(s) {
    var m = X_RE.exec(String(s || ""));
    return m ? m[1].toLowerCase().replace(/[–—]/, "-") : "";
  }

  // Ei-biisin oletusotsikko riippuu paikasta setissä: alussa [INTRO],
  // lopussa [OUTRO], välissä [VÄLI]. Ryhmä on peräkkäiset ei-biisit
  // samassa setissä; jos ryhmässä on useampi oletusotsikko, ne numeroidaan
  // ([INTRO 1], [INTRO 2] …). Oma otsikko pysyy.
  function nameExtras() {
    for (var i = 0; i < tracks.length; i++) {
      if (!isExtra(i)) continue;
      var k = tracks[i].set, j = i;
      while (j + 1 < tracks.length && tracks[j + 1].set === k && isExtra(j + 1)) j++;
      var word = i === setInfo[k].first ? "INTRO"
        : j + 1 >= tracks.length || tracks[j + 1].set !== k ? "OUTRO" : "VÄLI";
      var dflt = tracks.slice(i, j + 1).filter(function (tr) { return tr.dflt; });
      dflt.forEach(function (tr, c) {
        tr.title = "[" + word + (dflt.length > 1 ? " " + (c + 1) : "") + "]";
      });
      i = j;
    }
    markExtras();
  }

  // Ei-biisin numeron paikalla on sen oma merkki, tai ilman sitä x. Jos
  // missään setissä ei ole kahta ei-biisiä peräkkäin, merkitön ei-biisi on
  // setin alussa 0, lopussa x ja välissä -.
  function markExtras() {
    var pairs = tracks.some(function (tr, i) {
      return i && tr.x && tracks[i - 1].x && tracks[i - 1].set === tr.set;
    });
    tracks.forEach(function (tr, i) {
      if (!tr.x || tr.sym) return;
      tr.sym = pairs ? "x" : i === setInfo[tr.set].first ? "0"
        : i + 1 >= tracks.length || tracks[i + 1].set !== tr.set ? "x" : "-";
    });
  }

  // Palauttaa listan virheistä; tyhjä lista = kunnossa.
  function loadTracks(list) {
    var errors = [];
    var newSet = false, name = "", n = 1, xn = 0;
    tracks = [];
    sets = 1;
    setInfo = [null];
    (list || []).forEach(function (tr, i) {
      var start = parseTime(tr.t);
      // Hylätyn kappaleen setinvaihto ja otsikko siirtyvät seuraavalle kelvolliselle.
      if (tr.set) newSet = true;
      if ((tr.set || !i) && typeof tr.name === "string" && tr.name.trim()) name = tr.name.trim();
      if (isNaN(start)) {
        errors.push("Kappaleen " + (i + 1) + " aika “" + tr.t + "” ei ole muotoa m:ss tai h:mm:ss.");
        return;
      }
      if (tracks.length && start <= tracks[tracks.length - 1].start) {
        errors.push("Kappaleen " + (i + 1) + " alkuaika ei ole edellistä myöhäisempi.");
      }
      // Otsikoton biisi: nyt soi -kentässä näytetään järjestysnumero.
      var xt = xTitle(tr.title);
      var untitled = xt === null && !String(tr.title || "").trim();
      var title = untitled ? "" : String(tr.title);
      if (newSet && tracks.length) sets++;
      if (!tracks.length || newSet) {
        n = 1;
        xn = 0;
        setInfo[sets] = { name: name, first: tracks.length };
        name = "";
      }
      var o = { start: start, title: title, set: sets, n: xt === null ? n++ : -1 };
      if (xt !== null) {
        o.x = ++xn;
        o.sym = xSym(tr.title);
        o.title = xt ? "[" + xt + "]" : "";
        if (!xt) o.dflt = true;
      }
      if (untitled) o.untitled = true;
      tracks.push(o);
      newSet = false;
    });
    showSets = sets > 1 || setInfo.some(function (x) { return x && x.name; });
    nameExtras();
    return errors;
  }

  // Kansiokeikan kappaleet: alkuaika = edellisten tiedostojen kestojen summa.
  // Ei-biisi ("00 [Intro].mp3", "05 [x] Spiikki.mp3") toimii kuten biisilistassa.
  function loadFiles() {
    var n = 1, xn = 0, t = 0;
    tracks = [];
    sets = 1;
    setInfo = [null];
    files.forEach(function (f, i) {
      var xt = xTitle(f.title);
      if (f.set && i) sets++;
      if (!i || f.set) {
        n = 1;
        xn = 0;
        setInfo[sets] = { name: f.name || "", first: i };
      }
      var o = { start: t, title: f.title, set: sets, n: xt === null ? n++ : -1 };
      if (xt !== null) {
        o.x = ++xn;
        o.sym = xSym(f.title);
        o.title = xt ? "[" + xt + "]" : "";
        if (!xt) o.dflt = true;
      }
      tracks.push(o);
      t += f.len;
    });
    showSets = sets > 1 || setInfo.some(function (x) { return x && x.name; });
    nameExtras();
  }

  function duration() {
    if (files) {
      var last = files.length - 1;
      return tracks[last].start + files[last].len;
    }
    return isFinite(audio.duration) ? audio.duration : NaN;
  }
  function trackEnd(i) {
    return i + 1 < tracks.length ? tracks[i + 1].start : duration();
  }
  // Kappale, jonka alueella aika t on. Ennen ensimmäistä alkua → 0.
  function trackAt(t) {
    var idx = 0;
    for (var i = 0; i < tracks.length; i++) {
      if (tracks[i].start <= t + 0.005) idx = i; else break;
    }
    return idx;
  }

  // ---- Tila -------------------------------------------------------------

  var current = -1;        // korostettu kappale
  // KEICK•WALK-logon kuulokkeet: soivan kappaleen merkki listassa.
  function kuulokkeet(cls) {
    var w = document.createElement("span");
    w.innerHTML = '<svg class="' + cls + '" viewBox="0.49 2.3 18.89 18.2" aria-hidden="true">'
      + '<path d="M3.61 17.38V9.725A6.325 6.325 0 0 1 16.26 9.725V17.38" fill="none" stroke="currentColor" stroke-width="1.2"/>'
      + '<circle class="t" cx="3.61" cy="17.38" r="2.62"/><circle class="t" cx="16.26" cy="17.38" r="2.62"/></svg>';
    return w.firstChild;
  }
  var kuul = kuulokkeet("kuul");
  // Kuulokkeet soivan rivin piilotetun numeron paikalle: oikean tyynyn reuna (x 18,88) numeron
  // oikeassa reunassa, tyynyjen alareuna (y 20) perusviivalla ja sangan yläreuna (y 2,8) tekstin
  // sisältöalueen yläreunassa.
  function markCurrent(tr) {
    var n = tr.querySelector(".n");
    tr.insertBefore(kuul, tr.firstChild);
    var z = document.createElement("span"), a = document.createElement("span");
    z.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    a.textContent = "\u200b";
    n.appendChild(z);
    n.appendChild(a);
    var base = z.offsetTop, top = base - (z.getBoundingClientRect().top - a.getBoundingClientRect().top);
    n.removeChild(z);
    n.removeChild(a);
    var u = (base - top) / 17.2;
    kuul.style.width = 18.89 * u + "px";
    kuul.style.height = 18.2 * u + "px";
    kuul.style.left = n.offsetLeft + n.offsetWidth - (18.88 - 0.49) * u + "px";
    kuul.style.top = top - (2.8 - 2.3) * u + "px";
  }


  var pendingSeek = null;  // hyppy ennen kuin metadata on ladattu
  var dragging = false;
  var dragTime = 0;
  var dragSpan = null;     // vedon ajan jana, ettei se vaihdu biisin rajalla
  var rafId = 0;
  var longTimes = false;   // näytetäänkö h:mm:ss
  var scale = "gig";       // jana: "gig" = koko keikka, "song" = nykyinen biisi
  var setOnly = false;     // "Pysähdy setin lopussa"
  var stopAt = Infinity;   // kohta, johon toisto pysähtyy (seuraavan setin alku)

  // Pysähdyskohta lasketaan aina soittokohdan setistä: kun käyttäjä hyppää
  // toiseen settiin, pysähdytään sen lopussa.
  function armStop() {
    var was = stopAt;
    stopAt = Infinity;
    if (setOnly && tracks.length) {
      var k = tracks[trackAt(position())].set;
      if (k < sets) stopAt = setStart(k + 1);
    }
    if (stopAt !== was) renderTicks();
  }
  // Soitto ylitti setin rajan: pysäytetään ja jäädään seuraavan setin alkuun,
  // josta toisto jatkuu seuraavalla painalluksella.
  function checkStop() {
    // Kansiokeikassa setin raja hoidetaan tiedoston vaihdossa (advance).
    if (files) return;
    if (audio.paused || audio.currentTime < stopAt) return;
    var t = stopAt;
    audio.pause();
    audio.currentTime = t;
    armStop();
  }

  function position() {
    if (pendingSeek !== null) return pendingSeek;
    return (files ? tracks[cur].start : 0) + audio.currentTime;
  }

  // Kansiokeikassa seuraava tiedosto vaihdetaan vähän ennen edellisen loppua,
  // ei vasta ended-tapahtumassa. Lopussa selain asettaa paused-tilan ja
  // lähettää pause-tapahtuman, jolloin Android-kääre (silta.js) luulisi soiton
  // loppuneen ja päästäisi sovelluksen pois etualalta. Kun lähde vaihdetaan
  // kesken soiton ja play() kutsutaan heti perään, pause-tapahtumaa ei tule.
  var advTimer = 0;
  function clearAdvance() {
    if (advTimer) clearTimeout(advTimer);
    advTimer = 0;
  }
  function maybeAdvance() {
    if (!files || audio.paused || advTimer || cur + 1 >= files.length) return;
    var d = audio.duration;
    if (!isFinite(d)) return;
    var rem = (d - audio.currentTime) / (audio.playbackRate || 1);
    if (rem > 0.6) return;
    advTimer = setTimeout(advance, Math.max(0, rem * 1000 - 40));
  }
  function advance() {
    advTimer = 0;
    if (!files || cur + 1 >= files.length || pendingSeek !== null) return;
    if (!audio.ended && (audio.paused || audio.duration - audio.currentTime > 0.3)) return;
    var t = tracks[cur + 1].start;
    // Setin loppu: jäädään seuraavan setin alkuun kuten checkStop.
    if (t >= stopAt - 0.01) {
      audio.pause();
      seekTo(t);
      return;
    }
    loadFile(cur + 1, t, true);
  }
  function loadFile(j, t, autoplay) {
    clearAdvance();
    cur = j;
    pendingSeek = t;
    audio.src = files[j].url;
    if (autoplay) play();
  }

  // Janan alku ja loppu (s). Biisijanalla ensimmäiseen biisiin kuuluu myös
  // mahdollinen alku ennen sen merkittyä alkuaikaa, kuten trackAt-funktiossa.
  function span(i) {
    var d = duration();
    if (scale === "gig" || i < 0) return { a: 0, b: d };
    var b = trackEnd(i);
    if (isFinite(d)) b = Math.min(b, d);
    return { a: i === 0 ? 0 : tracks[i].start, b: b };
  }

  function seekTo(t) {
    var d = duration();
    if (isFinite(d)) t = Math.min(Math.max(0, t), d);
    else t = Math.max(0, t);
    if (files) {
      clearAdvance();
      var j = trackAt(t);
      if (j !== cur) {
        loadFile(j, t, !audio.paused);
      } else if (audio.readyState >= 1) {
        pendingSeek = null;
        audio.currentTime = Math.min(t - tracks[j].start, files[j].len);
      } else {
        pendingSeek = t;
      }
      armStop();
      render();
      return;
    }
    if (audio.readyState >= 1) {
      pendingSeek = null;
      audio.currentTime = t;
    } else {
      pendingSeek = t;
    }
    armStop();
    render();
  }

  function play() {
    if (pendingSeek !== null && audio.readyState >= 1) seekTo(pendingSeek);
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (e) {
        if (e && e.name === "NotAllowedError") return; // selain esti, käyttäjä voi painaa uudelleen
        // Kansiokeikassa tiedoston vaihto kesken latauksen keskeyttää edellisen play()-kutsun.
        if (files && e && e.name === "AbortError") return;
        if (!audio.error) showError("Toisto ei käynnistynyt.", e && e.message);
      });
    }
  }
  function toggle() {
    if (!gig) return;
    if (audio.paused) play(); else audio.pause();
  }

  function jumpTo(i, autoplay) {
    if (i < 0 || i >= tracks.length) return;
    seekTo(tracks[i].start);
    if (autoplay) play();
  }

  function prevTrack() {
    var t = position(), i = trackAt(t);
    // Yli 3 s biisin sisällä → saman biisin alkuun, muuten edelliseen.
    if (t - tracks[i].start > 3 || i === 0) jumpTo(i, !audio.paused);
    else jumpTo(i - 1, !audio.paused);
  }
  function nextTrack() {
    var i = trackAt(position());
    if (i + 1 < tracks.length) jumpTo(i + 1, !audio.paused);
  }
  function skip(delta) {
    if (isFinite(duration())) seekTo(position() + delta);
  }

  // ---- Piirto -----------------------------------------------------------

  function render() {
    var d = duration();
    var t = dragging ? dragTime : position();
    var i = tracks.length ? trackAt(t) : -1;
    var s = dragging ? dragSpan : span(i);
    var len = s.b - s.a;
    var known = isFinite(len) && len > 0;
    var frac = known ? Math.min(1, Math.max(0, (t - s.a) / len)) : 0;
    var lt = scale === "gig" ? longTimes : known && len >= 3600;
    var cur = fmt(t - s.a, lt);
    els.fill.style.width = frac * 100 + "%";
    els.knob.style.left = frac * 100 + "%";
    markTicks(t);
    els.cur.textContent = cur;
    els.dur.textContent = known ? fmt(len, lt) : "–:––";
    els.seek.setAttribute("aria-valuemax", known ? Math.floor(len) : 0);
    els.seek.setAttribute("aria-valuenow", Math.floor(Math.max(0, t - s.a)));
    els.seek.setAttribute("aria-valuetext", cur + " / " + (known ? fmt(len, lt) : "tuntematon"));

    if (i !== current) {
      if (current >= 0 && rows[current]) rows[current].removeAttribute("aria-current");
      current = i;
      if (i >= 0) {
        rows[i].setAttribute("aria-current", "true");
        markCurrent(rows[i].firstChild);
        renderNow(i);
        updateMediaSession();
      } else if (kuul.parentNode) kuul.parentNode.removeChild(kuul);
    }
    els.prev.disabled = !tracks.length;
    els.next.disabled = i < 0 || i + 1 >= tracks.length;
    els.back.disabled = els.fwd.disabled = !isFinite(d);
  }

  function renderPlayState() {
    var playing = !audio.paused;
    // SVG-elementillä ei ole .hidden-ominaisuutta, joten attribuutti suoraan.
    els.iconPlay.toggleAttribute("hidden", playing);
    els.iconPause.toggleAttribute("hidden", !playing);
    els.play.setAttribute("aria-label", playing ? "Tauko" : "Toista");
  }

  // Biisien alut näkyvät vain keikkajanalla; biisijana on yksi biisi. Ei-biisien
  // alkuja ei näytetä. Kun soitto pysähtyy setin lopussa, janan loppurengas on
  // pysähdyskohdassa ja janan jatko häipyy (.setti).
  var tickEls = [];        // [{ el, t }] alkuajan mukaan
  var ticksPassed = -1;    // montako palloa soittokohta on ohittanut
  var ringFrac = 1;        // loppurenkaan paikka janan osuutena
  function renderTicks() {
    var d = duration();
    var ring = scale === "gig" && isFinite(d) && stopAt < d ? stopAt : NaN;
    ringFrac = isFinite(ring) ? ring / d : 1;
    els.loppu.style.left = els.jatko.style.left = isFinite(ring) ? ringFrac * 100 + "%" : "";
    els.seek.classList.toggle("setti", isFinite(ring));
    if (isFinite(ring)) els.setend.textContent = fmt(ring, longTimes);
    placeSetEnd();
    els.ticks.innerHTML = "";
    tickEls = [];
    ticksPassed = -1;
    if (scale !== "gig" || !isFinite(d) || d <= 0) return;
    tracks.forEach(function (tr, i) {
      if (isExtra(i) || tr.start <= 0 || tr.start >= d) return;
      var k = document.createElement("div");
      k.className = "tick";
      k.style.left = (tr.start / d) * 100 + "%";
      els.ticks.appendChild(k);
      tickEls.push({ el: k, t: tr.start });
    });
    markTicks(dragging ? dragTime : position());
  }
  // Setti-asennossa janan pituuden tilalla on pysähdyskohdan aika keikan alusta,
  // renkaan alla keskellä (käyttäjän valinta 20.10.2026). Aika pysyy soittokohdan
  // ajasta erillään: soittokohta on samaa muotoa ja pienempi luku, joten se ei ole
  // aikaa leveämpi. Pois kytkettynä aika on janan pituuden paikalla, josta se
  // lähtee ja jonne se palaa renkaan mukana.
  function placeSetEnd() {
    var e = els.setend, on = els.seek.classList.contains("setti");
    els.times.classList.toggle("setti", on);
    var W = els.times.clientWidth, w = e.offsetWidth;
    var left = on ? ringFrac * W - w / 2 : W - w;
    e.style.left = Math.min(Math.max(left, w + 12), W - w) + "px";
  }
  window.addEventListener("resize", placeSetEnd);

  // Soittokohdan ohittamat pallot ovat isompia (.ohi). Raja kuten trackAt-funktiossa.
  function markTicks(t) {
    var n = 0;
    while (n < tickEls.length && tickEls[n].t <= t + 0.005) n++;
    if (n === ticksPassed) return;
    ticksPassed = n;
    tickEls.forEach(function (k, j) { k.el.classList.toggle("ohi", j < n); });
  }

  // Setin otsikko alkaa samasta kohdasta kuin setin ensimmäinen numero
  // ("1." tai ei-biisin "0."). Numerot on tasattu oikealle, joten kohta
  // riippuu fontista ja mitataan; CSS:n 11 px on numerosarakkeen vasen reuna.
  function alignSetNames() {
    heads.forEach(function (h) {
      var r = document.createRange();
      r.selectNodeContents(rows[h.first].querySelector(".n"));
      var x = r.getBoundingClientRect().left - h.li.getBoundingClientRect().left;
      if (x > 0) h.li.style.paddingLeft = x + "px";
    });
  }
  if (document.fonts) document.fonts.ready.then(function () { if (heads.length) alignSetNames(); placeSetEnd(); });

  function renderList() {
    els.list.innerHTML = "";
    els.list.classList.toggle("sets", showSets);
    rows = [];
    setLens = [];
    trackLens = [];
    heads = [];
    tracks.forEach(function (tr, i) {
      // Setin otsikko vain, jos settejä on useampi tai setti on nimetty.
      if (showSets && i === setInfo[tr.set].first) {
        var h = document.createElement("li");
        h.className = "set";
        h.innerHTML = '<span class="name"></span><span class="len num"></span><span class="sig" aria-hidden="true">Σ:</span>';
        h.children[0].textContent = setName(tr.set);
        setLens[tr.set] = h.children[1];
        heads.push({ li: h, first: i });
        els.list.appendChild(h);
      }
      var li = document.createElement("li");
      if (isExtra(i)) li.className = "pre";

      var b = document.createElement("button");
      b.type = "button";
      b.className = "track";
      b.innerHTML = '<span class="n num"></span><span class="tt"></span><span class="st num"></span>';
      b.children[0].textContent = num(i) + ".";
      b.children[1].textContent = tr.title;
      trackLens[i] = b.children[2];
      b.addEventListener("click", function () { jumpTo(i, true); });

      var c = document.createElement("button");
      c.type = "button";
      c.className = "copy";
      c.setAttribute("aria-label", "Kopioi linkki kappaleeseen " + ref(i));
      c.title = "Kopioi linkki";
      c.innerHTML = ICON_LINK;
      c.addEventListener("click", function () { copyLink(i, c); });

      li.appendChild(b);
      li.appendChild(c);
      els.list.appendChild(li);
      rows.push(li);
    });
    current = -1;
    alignSetNames();
    renderLens();
    els.setopt.hidden = sets < 2;
  }

  // Kappaleiden ja settien kestot. Viimeisen kappaleen ja setin kesto
  // selviää vasta, kun äänitiedoston pituus on tiedossa. Kestot lasketaan
  // pyöristämättömistä alkuajoista (sadasosat mukana), ja vasta näytettävä
  // kesto pyöristetään lähimpään sekuntiin. Setin kesto (Σ) on sen biisien
  // tarkkojen kestojen summa, joten näytetyt biisien kestot voivat erota
  // sekunnilla setin kestosta. Ei-biisejä ei lasketa setin kestoon.
  function lenOf(a, b) {
    var len = b - a;
    return isFinite(len) && len > 0 ? len : NaN;
  }
  // Tunnit näytetään ryhmittäin: setin kaikissa biiseissä, jos jokin sen
  // biiseistä on vähintään tunnin, ja kaikissa settien kestoissa, jos jokin
  // seteistä on. Pitkä setti ei siis yksin tuo tunteja biisien kestoihin.
  function renderLens() {
    var groups = { sets: [] }, sums = [];
    tracks.forEach(function (tr, i) {
      (groups[tr.set] = groups[tr.set] || []).push([trackLens[i], Math.round(lenOf(tr.start, trackEnd(i)))]);
      if (!isExtra(i)) sums[tr.set] = (sums[tr.set] || 0) + trackEnd(i) - tr.start;
    });
    for (var k = 1; k <= sets; k++) {
      if (setLens[k]) groups.sets.push([setLens[k], Math.round(lenOf(0, sums[k]))]);
    }
    Object.keys(groups).forEach(function (g) {
      var cells = groups[g];
      var long = cells.some(function (c) { return c[1] >= 3600; });
      cells.forEach(function (c) {
        if (c[0]) c[0].textContent = isFinite(c[1]) ? fmtLen(c[1], long) : "";
      });
    });
    rememberGig();
  }

  // ---- Linkin kopiointi -------------------------------------------------

  var ICON_LINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.5 19.8a4.3 4.3 0 0 1-3-7.3l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a2.3 2.3 0 0 0 3.2 3.2l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a4.3 4.3 0 0 1-3 1.3zM15.6 14.1a1 1 0 0 1-.7-1.7l2.2-2.2a2.3 2.3 0 0 0-3.2-3.2l-2.2 2.2a1 1 0 1 1-1.4-1.4l2.2-2.2a4.3 4.3 0 0 1 6 6l-2.2 2.2a1 1 0 0 1-.7.3z"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.6 5.4 12.5a1 1 0 1 0-1.4 1.4l4.8 4.8a1 1 0 0 0 1.4 0L20 8.9a1 1 0 0 0-1.4-1.4z"/></svg>';

  function linkFor(i) {
    return location.href.replace(/#.*$/, "") + "#" + gigKey +
      (gigWorker ? "@" + gigWorker : "") + "/" +
      (sets > 1 ? tracks[i].set + "/" : "") + linkNum(i);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyLink(i, btn) {
    var url = linkFor(i);
    var done = function (ok) {
      if (ok) {
        btn.classList.add("done");
        btn.innerHTML = ICON_CHECK;
        els.status.textContent = "Linkki kappaleeseen " + ref(i) + " kopioitu.";
        setTimeout(function () {
          btn.classList.remove("done");
          btn.innerHTML = ICON_LINK;
        }, 1500);
      } else {
        window.prompt("Kopioi linkki:", url);
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function () { done(true); },
        function () { done(fallbackCopy(url)); });
    } else {
      done(fallbackCopy(url));
    }
  }

  // ---- Virheet ----------------------------------------------------------

  function showError(msg, detail) {
    var p = document.createElement("p");
    if (els.error.childNodes.length) p.style.marginTop = "12px";
    p.textContent = msg;
    els.error.appendChild(p);
    if (detail) {
      var q = document.createElement("p");
      q.textContent = detail;
      els.error.appendChild(q);
    }
    els.error.hidden = false;
  }

  audio.addEventListener("error", function () {
    var e = audio.error;
    var code = e ? e.code : 0;
    var msg = "Äänitiedoston lataaminen epäonnistui.";
    var detail;
    if (code === 2) detail = "Verkkoyhteys katkesi tai palvelin ei vastannut. Tarkista yhteys ja lataa sivu uudelleen.";
    else if (code === 3) detail = "Tiedosto latautui, mutta selain ei pystynyt purkamaan sitä. Tiedosto voi olla vioittunut.";
    else if (code === 4) detail = "Tiedostoa ei löytynyt tai se ei ole äänitiedosto.";
    if (files && (code === 2 || code === 4) && refreshLinks()) return;
    if (/dropbox\.com/.test(gig.audio) && !/[?&]raw=1/.test(gig.audio)) {
      detail = (detail ? detail + " " : "") + "Dropbox-linkin lopussa pitää olla ?raw=1.";
    }
    // Drive-tiedosto soi workerin kautta (worker: Drive-tiedoston välitys).
    if (/\/api\/drive-file\?/.test(gig.audio)) {
      detail = (detail ? detail + " " : "") + "Tiedosto on Drivessa: tarkista, että se on jaettu kaikille " +
        "linkin saaneille ja että workerin koodi on päivitetty (käyttöönotto-ohje, Workerin päivitys; " +
        "pikakäyttöönotossa komento ~/.soitin/soitin paivita).";
    }
    showError(msg, detail);
    stopLoop();
    renderPlayState();
  });

  // ---- Toistosilmukka ---------------------------------------------------
  // requestAnimationFrame eikä timeupdate, koska timeupdate laukeaa vain
  // n. 4 kertaa sekunnissa ja nuppi liikkuisi nykien.

  function loop() {
    rafId = 0;
    if (audio.paused) return;
    checkStop();
    render();
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (!rafId) rafId = requestAnimationFrame(loop);
  }
  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  audio.addEventListener("play", function () { armStop(); renderPlayState(); startLoop(); });
  audio.addEventListener("pause", function () { stopLoop(); renderPlayState(); render(); });
  audio.addEventListener("ended", function () { stopLoop(); renderPlayState(); render(); });
  audio.addEventListener("seeked", render);
  // Piilossa render pitää myös lukitusnäytön kappaleen nimen ajan tasalla.
  // Piilossa animaatiosilmukka ei pyöri, joten setin raja tarkistetaan täällä.
  audio.addEventListener("timeupdate", function () {
    checkStop();
    if (audio.paused || document.hidden) render();
  });
  audio.addEventListener("loadedmetadata", onMeta);
  audio.addEventListener("durationchange", onMeta);

  function onMeta() {
    // Kansiokeikassa kesto mitattiin etukäteen. Jos tiedosto osoittautuu
    // eripituiseksi (esim. mp3:n arvioitu kesto tarkentuu), alkuajat lasketaan
    // uudelleen.
    var relist = false;
    if (files && isFinite(audio.duration) && Math.abs(audio.duration - files[cur].len) > 0.05) {
      files[cur].len = audio.duration;
      loadFiles();
      relist = true;
    }
    var d = duration();
    if (!isFinite(d)) return;
    longTimes = d >= 3600;
    if (relist) renderList();
    else renderLens();
    if (pendingSeek !== null && files) {
      var off = Math.min(pendingSeek - tracks[cur].start, files[cur].len);
      pendingSeek = null;
      if (off > 0.01 || audio.currentTime > 0.01) audio.currentTime = Math.max(0, off);
    } else if (pendingSeek !== null) {
      var t = pendingSeek;
      pendingSeek = null;
      audio.currentTime = Math.min(t, d);
    }
    armStop();
    els.seek.setAttribute("aria-disabled", "false");
    renderTicks();
    render();
  }

  // ---- Edistymispalkki --------------------------------------------------
  // Vedon aikana näytetään vain esikatselu; varsinainen haku tehdään kun
  // sormi nousee, ettei pitkää tiedostoa haeta verkosta jokaisella liikkeellä.
  // Jana lukitaan vedon alussa: biisijanalla oikeaan reunaan vedetty kohta on
  // jo seuraavan biisin alku, eikä jana saa vaihtua kesken vedon.

  function timeFromPointer(e) {
    var r = els.seek.getBoundingClientRect();
    var x = Math.min(Math.max(0, e.clientX - r.left), r.width);
    return dragSpan.a + (r.width ? (x / r.width) * (dragSpan.b - dragSpan.a) : 0);
  }
  els.seek.addEventListener("pointerdown", function (e) {
    if (!isFinite(duration()) || e.button > 0) return;
    dragSpan = span(trackAt(position()));
    dragging = true;
    dragTime = timeFromPointer(e);
    els.seek.setPointerCapture(e.pointerId);
    render();
    e.preventDefault();
  });
  els.seek.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    dragTime = timeFromPointer(e);
    render();
  });
  function endDrag(e, commit) {
    if (!dragging) return;
    dragging = false;
    if (commit) seekTo(timeFromPointer(e)); else render();
  }
  els.seek.addEventListener("pointerup", function (e) { endDrag(e, true); });
  els.seek.addEventListener("pointercancel", function (e) { endDrag(e, false); });

  els.seek.addEventListener("keydown", function (e) {
    if (!isFinite(duration())) return;
    var t = position(), handled = true;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") seekTo(t + 5);
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") seekTo(t - 5);
    else if (e.key === "PageUp") seekTo(t + 30);
    else if (e.key === "PageDown") seekTo(t - 30);
    else if (e.key === "Home") seekTo(span(trackAt(t)).a);
    else if (e.key === "End") seekTo(span(trackAt(t)).b);
    else handled = false;
    if (handled) e.preventDefault();
  });

  // ---- Napit ja näppäimistö ---------------------------------------------

  els.play.addEventListener("click", toggle);
  els.prev.addEventListener("click", prevTrack);
  els.next.addEventListener("click", nextTrack);
  els.back.addEventListener("click", function () { skip(-SKIP); });
  els.fwd.addEventListener("click", function () { skip(SKIP); });
  els.setonly.addEventListener("change", function () {
    setOnly = els.setonly.checked;
    // Setti-asennossa janakytkimen vasen puoli on setti, ei koko keikka.
    $("gigword").textContent = setOnly ? "setti" : "keikka";
    armStop();
  });
  els.songscale.addEventListener("change", function () {
    scale = els.songscale.checked ? "song" : "gig";
    renderTicks();
    render();
  });
  // Natsa piilottaa kytkimet; valinta muistetaan laitteella.
  function setFold(shut) {
    els.opts.classList.toggle("kiinni", shut);
    els.fold.setAttribute("aria-expanded", String(!shut));
    els.fold.setAttribute("aria-label", shut ? "Näytä kytkimet" : "Piilota kytkimet");
  }
  try { setFold(localStorage.getItem("soitin-kytkimet") === "kiinni"); } catch (e) {}
  els.fold.addEventListener("click", function (e) {
    e.stopPropagation();
    var shut = !els.opts.classList.contains("kiinni");
    setFold(shut);
    try {
      if (shut) localStorage.setItem("soitin-kytkimet", "kiinni");
      else localStorage.removeItem("soitin-kytkimet");
    } catch (e2) {}
  });

  // Kytkimen viereinen teksti valitsee oman puolensa (ei vaihda puolta).
  document.querySelectorAll(".sw .side").forEach(function (s) {
    s.addEventListener("click", function () {
      var input = s.parentNode.querySelector("input");
      var on = s.getAttribute("data-on") === "1";
      if (input.checked === on) return;
      input.checked = on;
      input.dispatchEvent(new Event("change"));
    });
  });

  function isTextField(el) {
    if (!el) return false;
    if (el.isContentEditable) return true;
    var tag = el.tagName;
    if (tag === "TEXTAREA" || tag === "SELECT") return true;
    if (tag !== "INPUT") return false;
    return !/^(radio|checkbox|button|submit|reset|range|color|file|image)$/i.test(el.type);
  }

  // Välilyönti: estetään myös keyup, ettei fokusoitu nappi saa omaa
  // klikkaustaan välilyönnistä (silloin toisto kytkeytyisi kahdesti).
  document.addEventListener("keydown", function (e) {
    if (e.key !== " " || e.ctrlKey || e.metaKey || e.altKey || isTextField(e.target)) return;
    e.preventDefault();
    if (!e.repeat) toggle();
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === " " && !isTextField(e.target)) e.preventDefault();
  });

  // ---- URL-hash ---------------------------------------------------------

  function applyHash() {
    var m = HASH_RE.exec(location.hash);
    if (!m || !m[3]) return;
    // #tunnus/3 = 1. setin kappale 3, #tunnus/2/3 = 2. setin kappale 3,
    // #tunnus/2/x1 = 2. setin ensimmäinen ei-biisi. Vanha /0 (setin alun
    // nollarivi) osoittaa setin ensimmäiseen raitaan, jos se on ei-biisi.
    var set = m[4] ? +m[3] : 1, r = (m[4] || m[3]).toLowerCase();
    var n = r[0] === "x" ? "x" + +r.slice(1) : +r === 0 ? "x1" : String(+r);
    var i = -1;
    for (var k = 0; k < tracks.length; k++) {
      if (tracks[k].set === set && linkNum(k) === n) { i = k; break; }
      if (tracks[k].set === set && +r === 0 && r[0] !== "x") break;
    }
    if (i >= 0) {
      jumpTo(i, false);
      var li = rows[i];
      if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
    }
  }
  window.addEventListener("hashchange", function () {
    var m = HASH_RE.exec(location.hash);
    // Eri keikan tunnus → ladataan sivu alusta; sama keikka → vain kappale.
    if (!m || m[1].toLowerCase() !== gigKey ||
        (m[2] || "").toLowerCase() !== gigWorker) location.reload();
    else if (gig) applyHash();
  });

  // ---- Lukitusnäytön ohjaimet (Media Session) ----------------------------

  function updateMediaSession() {
    if (!("mediaSession" in navigator) || !window.MediaMetadata || current < 0) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: nowText(current),
        album: gig.title
      });
    } catch (e) { /* ei tuettu */ }
  }
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    var set = function (a, fn) { try { ms.setActionHandler(a, fn); } catch (e) { /* ei tuettu */ } };
    set("play", play);
    set("pause", function () { audio.pause(); });
    set("previoustrack", prevTrack);
    set("nexttrack", nextTrack);
    set("seekbackward", function (d) { skip(-((d && d.seekOffset) || SKIP)); });
    set("seekforward", function (d) { skip((d && d.seekOffset) || SKIP); });
    set("seekto", function (d) { if (d && isFinite(d.seekTime)) seekTo(d.seekTime); });
  }

  // ---- Omat keikkani (verkko) --------------------------------------------
  // Sovelluksessa listan hoitaa Android-kääre (silta.js). Verkossa keikka, joka on
  // latautunut, muistetaan vain tämän selaimen localStorageen; mitään ei lähetetä
  // minnekään. Lista on sovelluksen kanssa yhteinen lista/keikat.html iframessa
  // soittimen päällä, joten sen avaaminen ei katkaise soittoa.

  var web = !window.SoitinApp;
  // Sovelluksessa otsikon ensimmäiseltä riviltä varataan tila silta.js:n kolmelle napille.
  if (!web) document.querySelector("main").classList.add("app");
  var LIST_KEY = "soitin-keikat";
  var listFrame = null;
  var removedGigs = {};  // poistettu mutta yhä auki: ei palaa listalle ennen avaamista

  function gigId() { return gigKey ? gigKey + (gigWorker ? "@" + gigWorker : "") : ""; }

  function readGigs() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(LIST_KEY)); } catch (e) { /* ei tallennustilaa */ }
    if (!d || typeof d !== "object") d = {};
    if (!Array.isArray(d.gigs)) d.gigs = [];
    return d;
  }
  function writeGigs(d) {
    try { localStorage.setItem(LIST_KEY, JSON.stringify(d)); } catch (e) { /* ei tallennustilaa */ }
  }

  // Biisien (ei ei-biisien) yhteiskesto sekunteina; -1, jos se ei ole vielä tiedossa.
  function songsLength() {
    var sum = 0, any = false;
    for (var i = 0; i < tracks.length; i++) {
      if (isExtra(i)) continue;
      var len = trackEnd(i) - tracks[i].start;
      if (!isFinite(len)) return -1;
      sum += len;
      any = true;
    }
    return any ? Math.round(sum) : -1;
  }

  // Lisäyspäivä on ensimmäisen latautumisen hetki. Otsikko, lisätieto ja kesto
  // päivittyvät sellaisiksi kuin soitin ne viimeksi näytti.
  function rememberGig() {
    var id = gigId();
    if (!web || !gig || !id || removedGigs[id]) return;
    var d = readGigs(), g = null;
    for (var k = 0; k < d.gigs.length; k++) {
      if (d.gigs[k] && d.gigs[k].id === id) { g = d.gigs[k]; break; }
    }
    if (!g) {
      g = { id: id, added: Date.now(), len: -1 };
      d.gigs.push(g);
    }
    g.title = gig.title;
    g.sub = (gig.sub || "").replace(/\u200b/g, "");
    var len = songsLength();
    if (len >= 0) g.len = len;
    writeGigs(d);
  }

  function showList() {
    if (!listFrame) {
      listFrame = document.createElement("iframe");
      listFrame.id = "lista";
      listFrame.title = "Omat keikkani";
      listFrame.src = "lista/keikat.html";
      document.body.appendChild(listFrame);
    } else {
      try { listFrame.contentWindow.__paivita(); } catch (e) { /* lataa vielä */ }
    }
    listFrame.hidden = false;
    document.documentElement.classList.add("lista");
    document.querySelector("main").inert = true;
    listFrame.focus();
  }
  function hideList() {
    if (!listFrame) return;
    listFrame.hidden = true;
    document.documentElement.classList.remove("lista");
    document.querySelector("main").inert = false;
    var b = $("omat");
    if (b) b.focus();
  }

  if (web) {
    // Sama silta kuin sovelluksen Keikat (MainActivity.ListBridge).
    window.__soitinLista = {
      data: function () {
        var d = readGigs();
        return JSON.stringify({ gigs: d.gigs, sort: d.sort || "added", current: gig ? gigId() : "" });
      },
      open: function (h) {
        var m = HASH_RE.exec("#" + h);
        if (!m) return false;
        var id = m[1].toLowerCase() + (m[2] ? "@" + m[2].toLowerCase() : "");
        if (removedGigs[id]) {
          delete removedGigs[id];
          if (id === gigId()) rememberGig();
        }
        hideList();
        // Eri keikka ladataan alusta ja kappale vaihdetaan hashchangessa.
        if (location.hash.toLowerCase() !== "#" + h.toLowerCase()) location.hash = h;
        return true;
      },
      remove: function (id) {
        var d = readGigs();
        d.gigs = d.gigs.filter(function (g) { return g && g.id !== id; });
        writeGigs(d);
        removedGigs[id] = true;
      },
      sort: function (s) {
        if (!/^-?(added|title|len)$/.test(s)) return;
        var d = readGigs();
        d.sort = s;
        writeGigs(d);
      },
      clear: function () {
        try { localStorage.removeItem(LIST_KEY); } catch (e) { /* ei tallennustilaa */ }
        removedGigs = {};
        if (gig) removedGigs[gigId()] = true;
        showList();
      },
      back: function () { if (gig) hideList(); },
      close: function () {}
    };

    var omat = document.createElement("button");
    omat.type = "button";
    omat.id = "omat";
    omat.setAttribute("aria-label", "Omat keikkani");
    omat.title = "Omat keikkani";
    omat.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    omat.addEventListener("click", showList);
    var mainEl = document.querySelector("main");
    mainEl.classList.add("omat");
    mainEl.insertBefore(omat, mainEl.firstChild);
  }

  // ---- Käynnistys -------------------------------------------------------

  function fail(msg, detail) {
    $("loading").hidden = true;
    showError(msg, detail);
  }

  function start(data) {
    gig = data;
    document.title = gig.title;
    els.title.textContent = gig.title;
    // Lisätieto vain sivulle, ei välilehden otsikkoon eikä linkin esikatseluun. Puuttuva lisätieto
    // piilottaa rivin. Vanhoissa keikoissa tyhjä rivi on voitu tallentaa nollaleveänä välilyöntinä
    // (U+200B); se ohitetaan.
    var sub = gig.sub || "";
    $("sub").textContent = sub;
    $("sub").hidden = !sub.replace(/\u200b/g, "");
    $("loading").hidden = true;
    $("app").hidden = false;

    if (files) {
      loadFiles();
      longTimes = duration() >= 3600;
    } else {
      var errors = loadTracks(withIntro(gig.tracks));
      if (errors.length) showError("Kappalelistassa on virhe.", errors.join(" "));
    }
    if (!tracks.length) {
      tracks.push({ start: 0, title: gig.title, set: 1, n: 1 });
      setInfo[1] = { name: "", first: 0 };
    }

    renderList();
    render();
    renderPlayState();
    applyHash();
    if (files) {
      // Tiedostojen vaihto kytketään vain kansiokeikalle. ended on varalla,
      // jos vaihto ennen loppua ei ehtinyt (esim. ajastin myöhästyi).
      audio.addEventListener("timeupdate", maybeAdvance);
      audio.addEventListener("pause", clearAdvance);
      audio.addEventListener("ended", function () { if (cur + 1 < files.length) advance(); });
      // Hash on voinut jo ladata oikean tiedoston.
      if (!audio.getAttribute("src")) audio.src = files[cur].url;
      els.seek.setAttribute("aria-disabled", "false");
      renderTicks();
      render();
    } else {
      audio.src = gig.audio;
    }
  }

  // ---- Lisäominaisuus: kansiokeikka --------------------------------------
  // Kestot, vanhentuneet linkit ja workerin kansiovirheet. Tavallinen keikka
  // ei käytä tätä osiota.

  var FOLDER_ERRORS = {
    dropbox_not_configured: "Workerista puuttuvat Dropbox-avaimet (käyttöönotto-ohje, liite).",
    dropbox_auth: "Dropbox ei hyväksynyt workerin avaimia. Ne on ehkä peruttu; tee avaimet uudelleen.",
    folder_not_owned: "Kansio ei ole sen Dropbox-tilin omistama, jolle workerin avaimet on tehty.",
    drive_not_configured: "Workerista puuttuu Googlen API-avain (käyttöönotto-ohje, liite; " +
      "pikakäyttöönotossa komento ~/.soitin/soitin drive-avain).",
    drive_key_invalid: "Google ei hyväksynyt workerin API-avainta.",
    drive_api_disabled: "Googlen projektissa ei ole Drive API:a päällä.",
    folder_not_found: "Kansiota ei löytynyt. Jakolinkki on ehkä poistettu, tai Drivessa kansiota ei ole jaettu kaikille linkin saaneille.",
    not_a_folder: "Tallennettu linkki ei osoita kansioon.",
    folder_empty: "Kansiossa ei ole äänitiedostoja.",
    too_many_files: "Kansiossa on liikaa tiedostoja (enintään 44)."
  };

  // Kesto luetaan tiedoston alusta (metadata), muutama kerrallaan.
  function probe(url) {
    return new Promise(function (resolve) {
      var a = new Audio(), done = false;
      var finish = function (len) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        a.removeAttribute("src");
        try { a.load(); } catch (e) { /* ei väliä */ }
        resolve(len);
      };
      var timer = setTimeout(function () { finish(NaN); }, 20000);
      a.preload = "metadata";
      a.addEventListener("loadedmetadata", function () { finish(isFinite(a.duration) ? a.duration : NaN); });
      a.addEventListener("error", function () { finish(NaN); });
      a.src = url;
    });
  }

  function probeAll(list, onProgress) {
    var next = 0, done = 0;
    return new Promise(function (resolve) {
      if (!list.length) { resolve(); return; }
      function run() {
        if (next >= list.length) return;
        var f = list[next++];
        probe(f.url).then(function (len) {
          f.len = len;
          onProgress(++done, list.length);
          if (done === list.length) resolve(); else run();
        });
      }
      for (var k = 0; k < 4; k++) run();
    });
  }

  // Kansion tiedot workerin vastauksesta. Tiedosto, jonka kestoa ei saatu,
  // jätetään pois; sen setinvaihto ja otsikko siirtyvät seuraavalle.
  function prepareFiles(data) {
    var list = data.files.filter(function (f) {
      return f && typeof f.url === "string" && /^https:\/\//.test(f.url);
    }).map(function (f, i) {
      var o = { url: f.url, title: String(f.title || "Kappale " + (i + 1)), len: NaN };
      if (f.set === true) o.set = true;
      if (typeof f.name === "string" && f.name.trim()) o.name = f.name.trim();
      return o;
    });
    var loading = $("loading");
    return probeAll(list, function (k, n) {
      loading.textContent = "Ladataan kappaleita… " + k + "/" + n;
    }).then(function () {
      var ok = [], lost = [], carry = null;
      list.forEach(function (f) {
        if (!(f.len > 0)) {
          lost.push(f.title);
          if (f.set || f.name) carry = { set: f.set, name: f.name };
          return;
        }
        if (carry) {
          if (carry.set) f.set = true;
          if (carry.name && !f.name) f.name = carry.name;
          carry = null;
        }
        ok.push(f);
      });
      return { files: ok, lost: lost };
    });
  }

  // Dropboxin suorat linkit vanhenevat neljässä tunnissa. Kun lataus
  // epäonnistuu, haetaan uudet linkit ja jatketaan samasta kohdasta.
  var refreshedAt = 0;
  function refreshLinks() {
    if (Date.now() - refreshedAt < 60000) return false;
    refreshedAt = Date.now();
    var t = position(), resume = playIntent;
    fetch(gigApi + "?k=" + encodeURIComponent(gigKey), { cache: "no-store" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        var fresh = data && Array.isArray(data.files) ? data.files : [];
        var same = fresh.length === files.length && fresh.every(function (f, i) {
          return String(f.title || "") === files[i].title && typeof f.url === "string";
        });
        if (!same) {
          showError("Kansion sisältö on muuttunut.", "Lataa sivu uudelleen.");
          return;
        }
        fresh.forEach(function (f, i) { files[i].url = f.url; });
        loadFile(trackAt(t), t, resume);
      })
      .catch(function () {
        showError("Äänitiedoston lataaminen epäonnistui.",
          "Verkkoyhteys katkesi tai palvelin ei vastannut. Tarkista yhteys ja lataa sivu uudelleen.");
      });
    return true;
  }
  var playIntent = false;
  audio.addEventListener("play", function () { playIntent = true; });
  audio.addEventListener("pause", function () { playIntent = false; });

  var gigApi = API;
  var hm = HASH_RE.exec(location.hash);
  if (!hm && web) {
    // Pelkkä soitin/ ilman tunnusta: Omat keikkani, jossa tunnuksen voi kirjoittaa.
    $("loading").hidden = true;
    showList();
  } else if (!hm) {
    fail("Linkistä puuttuu keikan tunnus.",
      "Tarkista, että linkki on kopioitu kokonaan, myös #-merkin jälkeinen osa.");
  } else {
    gigKey = hm[1].toLowerCase();
    gigWorker = (hm[2] || "").toLowerCase();
    var api = gigApi = gigWorker ? "https://" + gigWorker + ".workers.dev/api/gig" : API;
    fetch(api + "?k=" + encodeURIComponent(gigKey), { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) {
          throw { user: "Keikkaa ei löytynyt.",
                  detail: "Linkki voi olla vanhentunut tai kopioitunut vajaana." };
        }
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (b) {
            var fe = b && FOLDER_ERRORS[b.error];
            throw { user: fe ? "Keikan kansiota ei saatu luettua." : "Keikan tietoja ei saatu palvelimelta.",
                    detail: fe || "Palvelin vastasi virheellä " + res.status + ". Yritä hetken päästä uudelleen." };
          });
        }
        return res.json();
      })
      .then(function (data) {
        var title = String((data && data.title) || "Keikka");
        var sub = data && typeof data.sub === "string" ? data.sub.trim() : "";
        if (data && Array.isArray(data.files)) {
          els.title.textContent = title;
          return prepareFiles(data).then(function (r) {
            if (!r.files.length) throw { user: "Kansion tiedostoja ei saatu ladattua.",
              detail: "Tarkista verkkoyhteys ja lataa sivu uudelleen." };
            files = r.files;
            start({ title: title, sub: sub, files: files });
            if (r.lost.length) showError("Kaikkia kappaleita ei saatu ladattua; ne ohitetaan.", r.lost.join(", "));
          });
        }
        if (!data || typeof data.audio !== "string" || !Array.isArray(data.tracks)) {
          throw { user: "Keikan tiedot ovat virheelliset." };
        }
        start({ title: title, sub: sub, audio: data.audio, tracks: data.tracks });
      })
      .catch(function (e) {
        if (e && e.user) fail(e.user, e.detail);
        else fail("Keikan tietojen haku epäonnistui.",
          "Tarkista verkkoyhteys ja lataa sivu uudelleen.");
      });
  }
})();
</script>
</body>
</html>
