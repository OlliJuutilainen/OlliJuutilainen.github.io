<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Soitin</title>
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1b1b1a;
    --muted: #6d6b66;
    --line: #dcd9d2;
    --soft: #efede8;
    --accent: #157570;
    --err-bg: #fbeae5;
    --err-fg: #7a2511;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --fg: #ebe9e4;
      --muted: #9b9890;
      --line: #393834;
      --soft: #22221f;
      --accent: #20b2aa;
      --err-bg: #3a1d14;
      --err-fg: #f6c2ad;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 16px 48px;
  }
  h1 {
    font-size: 1.45rem;
    line-height: 1.25;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 22px;
    overflow-wrap: anywhere;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  button:focus-visible, .seek:focus-visible, .mode label:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  svg { display: block; fill: currentColor; }
  .num { font-variant-numeric: tabular-nums; }

  /* --- Virheilmoitus --- */
  .error {
    background: var(--err-bg);
    color: var(--err-fg);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 20px;
  }
  .error p { margin: 0; }
  .error p + p { margin-top: 6px; font-size: 0.9rem; }

  /* --- Soitin --- */
  .now {
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.45em;
    margin: 0 0 4px;
    overflow-wrap: anywhere;
  }
  .seek {
    position: relative;
    height: 44px;
    touch-action: none;
    cursor: pointer;
    outline: none;
    border-radius: 4px;
  }
  .seek[aria-disabled="true"] { cursor: default; }
  .bar {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 4px;
    margin-top: -2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--fg);
  }
  .tick {
    position: absolute;
    top: 50%;
    width: 2px;
    height: 10px;
    margin: -5px 0 0 -1px;
    background: var(--bg);
    pointer-events: none;
  }
  /* Kohta, jossa "Pysähdy setin lopussa" pysäyttää. */
  .tick.stop { height: 16px; margin-top: -8px; background: var(--accent); }
  .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--fg);
    pointer-events: none;
  }
  .seek[aria-disabled="true"] .knob { display: none; }
  /* Aika janan alla: vasemmalla kohta, oikealla janan pituus. Jana on 44 px
     korkea ja viiva sen keskellä, joten rivi nostetaan lähemmäs viivaa. */
  .times {
    display: flex;
    justify-content: space-between;
    margin-top: -10px;
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .ctls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }
  .ctl {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  .ctl:disabled { opacity: 0.35; cursor: default; }
  .ctl svg { width: 22px; height: 22px; }
  .ctl.play {
    width: 56px;
    height: 56px;
    background: var(--fg);
    color: var(--bg);
  }
  .ctl.play svg { width: 26px; height: 26px; }
  .ctl.skip svg { width: 24px; height: 24px; }

  /* --- Janan mittakaava --- */
  /* Pieni, keskitetty valitsin: ei kilpaile soittimen painikkeiden kanssa. */
  .mode {
    border: 0;
    margin: 14px auto 22px;
    width: fit-content;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--soft);
    border-radius: 8px;
    padding: 2px;
  }
  .mode legend {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .mode label {
    min-height: 32px;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2px 14px;
    border-radius: 6px;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
  }
  .mode input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .mode label:has(input:checked) {
    background: var(--bg);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }

  /* --- Pysähdy setin lopussa --- */
  .mode:has(+ .opt:not([hidden])) { margin-bottom: 8px; }
  .opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 44px;
    margin: 0 0 22px;
    padding: 0 3px 0 11px;
    color: var(--muted);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .opt input {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    position: relative;
    width: 40px;
    height: 24px;
    margin: 0;
    border-radius: 12px;
    background: var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .opt input::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--bg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    transition: transform 0.15s;
  }
  .opt input:checked { background: var(--accent); }
  .opt input:checked::after { transform: translateX(16px); }
  .opt:has(input:checked) { color: var(--fg); }
  .opt input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- Kappalelista --- */
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  li {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
  }
  .track {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 48px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 4px 12px 8px;
    text-align: left;
    border-left: 3px solid transparent;
  }
  .track .n {
    flex: 0 0 auto;
    min-width: 1.6em;
    color: var(--muted);
    text-align: right;
  }
  .track .tt {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .track .st {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 0.9rem;
  }
  li[aria-current="true"] .track {
    border-left-color: var(--accent);
    font-weight: 600;
  }
  li[aria-current="true"] .track .n { color: var(--accent); }
  /* Esinumero 0: "0. [Intro] 0:00", koko rivi himmeä ja kursiivi. Koot
     ja asettelu kuten muilla riveillä. */
  li.pre .track { font-style: italic; }
  li.pre .track .tt { color: var(--muted); }
  /* Setin otsikko (i), (ii) …: jokainen setti alkaa kuin oma listansa. */
  ol.sets { border-top: 0; }
  li.set {
    display: block;
    padding: 30px 0 6px 11px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  li.set .len { margin-left: 0.8em; opacity: 0.8; }
  li.set:first-child { padding-top: 0; }
  .copy {
    flex: 0 0 44px;
    min-height: 44px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .copy svg { width: 18px; height: 18px; }
  .copy.done { color: var(--accent); }
  @media (hover: hover) {
    .track:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
    .copy:hover { color: var(--fg); }
  }
  .loading { color: var(--muted); margin: 0; }
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Soitin</h1>
  <p class="loading" id="loading">Ladataan keikan tietoja…</p>

  <div class="error" id="error" role="alert" hidden></div>

  <div id="app" hidden>
  <section aria-label="Soitin">
    <p class="now" id="now" aria-live="polite"></p>
    <div class="seek" id="seek" role="slider" tabindex="0"
         aria-label="Soittokohta" aria-valuemin="0" aria-valuemax="0"
         aria-valuenow="0" aria-valuetext="0:00" aria-disabled="true">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div id="ticks"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="times num"><span id="cur">0:00</span><span id="dur">–:––</span></div>
    <div class="ctls">
      <button class="ctl" id="prev" type="button" aria-label="Edellinen kappale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="ctl skip" id="back" type="button" aria-label="15 sekuntia taaksepäin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 1 0 8-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v7L7.5 5z"/></svg>
      </button>
      <button class="ctl play" id="play" type="button" aria-label="Toista">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="icon-play"><path d="M7 4.5v15L20 12z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" id="icon-pause" hidden><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>
      </button>
      <button class="ctl skip" id="fwd" type="button" aria-label="15 sekuntia eteenpäin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a8 8 0 1 1-8-8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v7L16.5 5z"/></svg>
      </button>
      <button class="ctl" id="next" type="button" aria-label="Seuraava kappale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
  </section>

  <fieldset class="mode">
    <legend>Janan mittakaava</legend>
    <label><input type="radio" name="scale" value="gig" checked> Keikkajana</label>
    <label><input type="radio" name="scale" value="song"> Biisijana</label>
  </fieldset>

  <label class="opt" id="setopt" hidden>
    <span>Pysähdy setin lopussa</span>
    <input type="checkbox" role="switch" id="setonly">
  </label>

  <ol id="list" aria-label="Kappaleet"></ol>
  <p class="sr" id="status" aria-live="polite"></p>
  </div>

  <audio id="audio" preload="metadata"></audio>
</main>

<script>
(function () {
  "use strict";

  // Hyppynappien askel (s). Hyppy saa ylittää biisin rajan.
  var SKIP = 15;

  // Keikan tiedot (otsikko, mp3-linkki, biisilista) haetaan workerista.
  // Repossa ei ole yhtään keikkaa: tunnus kulkee osoitteen #-osassa,
  // esim. …/soitin/#k7f3qa2m tai kappaleeseen 3: …/soitin/#k7f3qa2m/3.
  // Jos keikassa on useampi setti, toisen setin kappale 3 on …/#k7f3qa2m/2/3.
  // Tiedot tallennetaan apusivulla soitin/uusi.html.
  var API = "https://tusinasaa-worker.ollijuutilainen.workers.dev/api/gig";
  var HASH_RE = /^#([a-z0-9]{4,32})(?:\/(\d+)(?:\/(\d+))?)?$/i;

  var $ = function (id) { return document.getElementById(id); };
  var audio = $("audio");
  var els = {
    title: $("title"), error: $("error"), now: $("now"), seek: $("seek"),
    fill: $("fill"), ticks: $("ticks"), knob: $("knob"), cur: $("cur"), dur: $("dur"),
    play: $("play"), prev: $("prev"), next: $("next"), back: $("back"), fwd: $("fwd"),
    list: $("list"), setopt: $("setopt"), setonly: $("setonly"),
    status: $("status"), iconPlay: $("icon-play"), iconPause: $("icon-pause")
  };

  // ---- Aikojen jäsennys ja muotoilu --------------------------------------

  function parseTime(s) {
    var m = /^\s*(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.(\d+))?\s*$/.exec(String(s));
    if (!m) return NaN;
    var h = m[1] ? +m[1] : 0, min = +m[2], sec = +m[3];
    if (sec > 59 || (m[1] && min > 59)) return NaN;
    return h * 3600 + min * 60 + sec + (m[4] ? +("0." + m[4]) : 0);
  }

  function fmt(t, long) {
    if (!isFinite(t) || t < 0) t = 0;
    t = Math.floor(t);
    var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    var ss = (s < 10 ? "0" : "") + s;
    if (h || long) return h + ":" + (m < 10 ? "0" : "") + m + ":" + ss;
    return m + ":" + ss;
  }

  // ---- Kappaleet --------------------------------------------------------

  var gig = null;      // { title, audio, tracks: [{ t, title }] }
  var gigKey = "";
  var tracks = [];     // [{ start, title, set, n }]
  var sets = 1;
  var setInfo = [];    // [{ name, first }] setin numerolla 1… (indeksi 0 tyhjä)
  var showSets = false;
  var rows = [];       // kappaleiden li-elementit, tracks-järjestyksessä
  var setLens = [];    // setin otsikkorivin kestokentät

  // Keikka voi jakautua setteihin (biisilistan ---); kenttä set: true on
  // uuden setin ensimmäisessä kappaleessa ja name sen oma otsikko, esim. "(+)".
  // Numerointi alkaa joka setissä 1:stä. Jos setin ensimmäisen nimi on
  // hakasulkeissa, se on esinumero 0.
  function num(i) { return tracks[i].n; }
  function setName(k) { return setInfo[k].name || "(" + roman(k) + ")"; }
  // Kappaleen tunniste teksteihin: "3" tai setteihin jaetussa "(ii) 3".
  function ref(i) { return (showSets ? setName(tracks[i].set) + " " : "") + num(i); }
  // Setin alku ja loppu (s). Viimeinen setti päättyy äänitiedoston loppuun.
  function setStart(k) { return tracks[setInfo[k].first].start; }
  function setEnd(k) { return k < sets ? setStart(k + 1) : duration(); }
  function roman(n) {
    var r = "", v = [40, 10, 9, 5, 4, 1], d = ["xl", "x", "ix", "v", "iv", "i"];
    for (var k = 0; k < v.length; k++) while (n >= v[k]) { r += d[k]; n -= v[k]; }
    return r;
  }

  // Jos ensimmäinen kappale alkaa myöhemmin kuin 0:00 eikä se ole
  // hakasulkeissa, alkuun lisätään esinumero [INTRO]. Lisäys on vain
  // näytössä, ei tallennetussa keikassa. Setin otsikko siirtyy introlle.
  function withIntro(list) {
    var f = (list || [])[0];
    if (!f || !(parseTime(f.t) > 0) || /^\[.*\]$/.test(String(f.title || "").trim())) return list;
    var intro = { t: "0:00", title: "[INTRO]" };
    if (f.name) intro.name = f.name;
    return [intro, { t: f.t, title: f.title }].concat(list.slice(1));
  }

  // Palauttaa listan virheistä; tyhjä lista = kunnossa.
  function loadTracks(list) {
    var errors = [];
    var newSet = false, name = "", n = 1;
    tracks = [];
    sets = 1;
    setInfo = [null];
    (list || []).forEach(function (tr, i) {
      var start = parseTime(tr.t);
      // Hylätyn kappaleen setinvaihto ja otsikko siirtyvät seuraavalle kelvolliselle.
      if (tr.set) newSet = true;
      if ((tr.set || !i) && typeof tr.name === "string" && tr.name.trim()) name = tr.name.trim();
      if (isNaN(start)) {
        errors.push("Kappaleen " + (i + 1) + " aika “" + tr.t + "” ei ole muotoa m:ss tai h:mm:ss.");
        return;
      }
      if (tracks.length && start <= tracks[tracks.length - 1].start) {
        errors.push("Kappaleen " + (i + 1) + " alkuaika ei ole edellistä myöhäisempi.");
      }
      var title = String(tr.title || "Kappale " + (i + 1));
      if (newSet && tracks.length) sets++;
      if (!tracks.length || newSet) {
        n = /^\[.*\]$/.test(title.trim()) ? 0 : 1;
        setInfo[sets] = { name: name, first: tracks.length };
        name = "";
      }
      tracks.push({ start: start, title: title, set: sets, n: n++ });
      newSet = false;
    });
    showSets = sets > 1 || setInfo.some(function (x) { return x && x.name; });
    return errors;
  }

  function duration() {
    return isFinite(audio.duration) ? audio.duration : NaN;
  }
  function trackEnd(i) {
    return i + 1 < tracks.length ? tracks[i + 1].start : duration();
  }
  // Kappale, jonka alueella aika t on. Ennen ensimmäistä alkua → 0.
  function trackAt(t) {
    var idx = 0;
    for (var i = 0; i < tracks.length; i++) {
      if (tracks[i].start <= t + 0.005) idx = i; else break;
    }
    return idx;
  }

  // ---- Tila -------------------------------------------------------------

  var current = -1;        // korostettu kappale
  var pendingSeek = null;  // hyppy ennen kuin metadata on ladattu
  var dragging = false;
  var dragTime = 0;
  var dragSpan = null;     // vedon ajan jana, ettei se vaihdu biisin rajalla
  var rafId = 0;
  var longTimes = false;   // näytetäänkö h:mm:ss
  var scale = "gig";       // jana: "gig" = koko keikka, "song" = nykyinen biisi
  var setOnly = false;     // "Pysähdy setin lopussa"
  var stopAt = Infinity;   // kohta, johon toisto pysähtyy (seuraavan setin alku)

  // Pysähdyskohta lasketaan aina soittokohdan setistä: kun käyttäjä hyppää
  // toiseen settiin, pysähdytään sen lopussa.
  function armStop() {
    var was = stopAt;
    stopAt = Infinity;
    if (setOnly && tracks.length) {
      var k = tracks[trackAt(position())].set;
      if (k < sets) stopAt = setStart(k + 1);
    }
    if (stopAt !== was) renderTicks();
  }
  // Soitto ylitti setin rajan: pysäytetään ja jäädään seuraavan setin alkuun,
  // josta toisto jatkuu seuraavalla painalluksella.
  function checkStop() {
    if (audio.paused || audio.currentTime < stopAt) return;
    var t = stopAt;
    audio.pause();
    audio.currentTime = t;
    armStop();
  }

  function position() {
    return pendingSeek !== null ? pendingSeek : audio.currentTime;
  }

  // Janan alku ja loppu (s). Biisijanalla ensimmäiseen biisiin kuuluu myös
  // mahdollinen alku ennen sen merkittyä alkuaikaa, kuten trackAt-funktiossa.
  function span(i) {
    var d = duration();
    if (scale === "gig" || i < 0) return { a: 0, b: d };
    var b = trackEnd(i);
    if (isFinite(d)) b = Math.min(b, d);
    return { a: i === 0 ? 0 : tracks[i].start, b: b };
  }

  function seekTo(t) {
    var d = duration();
    if (isFinite(d)) t = Math.min(Math.max(0, t), d);
    else t = Math.max(0, t);
    if (audio.readyState >= 1) {
      pendingSeek = null;
      audio.currentTime = t;
    } else {
      pendingSeek = t;
    }
    armStop();
    render();
  }

  function play() {
    if (pendingSeek !== null && audio.readyState >= 1) seekTo(pendingSeek);
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (e) {
        if (e && e.name === "NotAllowedError") return; // selain esti, käyttäjä voi painaa uudelleen
        if (!audio.error) showError("Toisto ei käynnistynyt.", e && e.message);
      });
    }
  }
  function toggle() {
    if (!gig) return;
    if (audio.paused) play(); else audio.pause();
  }

  function jumpTo(i, autoplay) {
    if (i < 0 || i >= tracks.length) return;
    seekTo(tracks[i].start);
    if (autoplay) play();
  }

  function prevTrack() {
    var t = position(), i = trackAt(t);
    // Yli 3 s biisin sisällä → saman biisin alkuun, muuten edelliseen.
    if (t - tracks[i].start > 3 || i === 0) jumpTo(i, !audio.paused);
    else jumpTo(i - 1, !audio.paused);
  }
  function nextTrack() {
    var i = trackAt(position());
    if (i + 1 < tracks.length) jumpTo(i + 1, !audio.paused);
  }
  function skip(delta) {
    if (isFinite(duration())) seekTo(position() + delta);
  }

  // ---- Piirto -----------------------------------------------------------

  function render() {
    var d = duration();
    var t = dragging ? dragTime : position();
    var i = tracks.length ? trackAt(t) : -1;
    var s = dragging ? dragSpan : span(i);
    var len = s.b - s.a;
    var known = isFinite(len) && len > 0;
    var frac = known ? Math.min(1, Math.max(0, (t - s.a) / len)) : 0;
    var lt = scale === "gig" ? longTimes : known && len >= 3600;
    var cur = fmt(t - s.a, lt);
    els.fill.style.width = frac * 100 + "%";
    els.knob.style.left = frac * 100 + "%";
    els.cur.textContent = cur;
    els.dur.textContent = known ? fmt(len, lt) : "–:––";
    els.seek.setAttribute("aria-valuemax", known ? Math.floor(len) : 0);
    els.seek.setAttribute("aria-valuenow", Math.floor(Math.max(0, t - s.a)));
    els.seek.setAttribute("aria-valuetext", cur + " / " + (known ? fmt(len, lt) : "tuntematon"));

    if (i !== current) {
      if (current >= 0 && rows[current]) rows[current].removeAttribute("aria-current");
      current = i;
      if (i >= 0) {
        rows[i].setAttribute("aria-current", "true");
        els.now.textContent = tracks[i].title;
        updateMediaSession();
      }
    }
    els.prev.disabled = !tracks.length;
    els.next.disabled = i < 0 || i + 1 >= tracks.length;
    els.back.disabled = els.fwd.disabled = !isFinite(d);
  }

  function renderPlayState() {
    var playing = !audio.paused;
    // SVG-elementillä ei ole .hidden-ominaisuutta, joten attribuutti suoraan.
    els.iconPlay.toggleAttribute("hidden", playing);
    els.iconPause.toggleAttribute("hidden", !playing);
    els.play.setAttribute("aria-label", playing ? "Tauko" : "Toista");
  }

  // Biisirajat näkyvät vain keikkajanalla; biisijana on yksi biisi.
  function renderTicks() {
    var d = duration();
    els.ticks.innerHTML = "";
    if (scale !== "gig" || !isFinite(d) || d <= 0) return;
    tracks.forEach(function (tr) {
      if (tr.start <= 0 || tr.start >= d) return;
      var k = document.createElement("div");
      k.className = tr.start === stopAt ? "tick stop" : "tick";
      k.style.left = (tr.start / d) * 100 + "%";
      els.ticks.appendChild(k);
    });
  }

  function renderList() {
    els.list.innerHTML = "";
    els.list.classList.toggle("sets", showSets);
    rows = [];
    setLens = [];
    tracks.forEach(function (tr, i) {
      // Setin otsikko vain, jos settejä on useampi tai setti on nimetty.
      if (showSets && i === setInfo[tr.set].first) {
        var h = document.createElement("li");
        h.className = "set";
        h.innerHTML = '<span class="name"></span><span class="len num"></span>';
        h.children[0].textContent = setName(tr.set);
        setLens[tr.set] = h.children[1];
        els.list.appendChild(h);
      }
      var li = document.createElement("li");
      if (num(i) === 0) li.className = "pre";

      var b = document.createElement("button");
      b.type = "button";
      b.className = "track";
      b.innerHTML = '<span class="n num"></span><span class="tt"></span><span class="st num"></span>';
      b.children[0].textContent = num(i) + ".";
      b.children[1].textContent = tr.title;
      b.children[2].textContent = fmt(tr.start, longTimes);
      b.addEventListener("click", function () { jumpTo(i, true); });

      var c = document.createElement("button");
      c.type = "button";
      c.className = "copy";
      c.setAttribute("aria-label", "Kopioi linkki kappaleeseen " + ref(i));
      c.title = "Kopioi linkki";
      c.innerHTML = ICON_LINK;
      c.addEventListener("click", function () { copyLink(i, c); });

      li.appendChild(b);
      li.appendChild(c);
      els.list.appendChild(li);
      rows.push(li);
    });
    current = -1;
    renderSetLens();
    els.setopt.hidden = sets < 2;
  }

  // Setin kesto otsikkoriville. Viimeisen setin kesto selviää vasta, kun
  // äänitiedoston pituus on tiedossa.
  function renderSetLens() {
    for (var k = 1; k <= sets; k++) {
      if (!setLens[k]) continue;
      var len = setEnd(k) - setStart(k);
      setLens[k].textContent = isFinite(len) && len > 0 ? fmt(len, false) : "";
    }
  }

  // ---- Linkin kopiointi -------------------------------------------------

  var ICON_LINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.5 19.8a4.3 4.3 0 0 1-3-7.3l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a2.3 2.3 0 0 0 3.2 3.2l2.2-2.2a1 1 0 1 1 1.4 1.4l-2.2 2.2a4.3 4.3 0 0 1-3 1.3zM15.6 14.1a1 1 0 0 1-.7-1.7l2.2-2.2a2.3 2.3 0 0 0-3.2-3.2l-2.2 2.2a1 1 0 1 1-1.4-1.4l2.2-2.2a4.3 4.3 0 0 1 6 6l-2.2 2.2a1 1 0 0 1-.7.3z"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.6 5.4 12.5a1 1 0 1 0-1.4 1.4l4.8 4.8a1 1 0 0 0 1.4 0L20 8.9a1 1 0 0 0-1.4-1.4z"/></svg>';

  function linkFor(i) {
    return location.href.replace(/#.*$/, "") + "#" + gigKey + "/" +
      (sets > 1 ? tracks[i].set + "/" : "") + num(i);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyLink(i, btn) {
    var url = linkFor(i);
    var done = function (ok) {
      if (ok) {
        btn.classList.add("done");
        btn.innerHTML = ICON_CHECK;
        els.status.textContent = "Linkki kappaleeseen " + ref(i) + " kopioitu.";
        setTimeout(function () {
          btn.classList.remove("done");
          btn.innerHTML = ICON_LINK;
        }, 1500);
      } else {
        window.prompt("Kopioi linkki:", url);
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function () { done(true); },
        function () { done(fallbackCopy(url)); });
    } else {
      done(fallbackCopy(url));
    }
  }

  // ---- Virheet ----------------------------------------------------------

  function showError(msg, detail) {
    var p = document.createElement("p");
    if (els.error.childNodes.length) p.style.marginTop = "12px";
    p.textContent = msg;
    els.error.appendChild(p);
    if (detail) {
      var q = document.createElement("p");
      q.textContent = detail;
      els.error.appendChild(q);
    }
    els.error.hidden = false;
  }

  audio.addEventListener("error", function () {
    var e = audio.error;
    var code = e ? e.code : 0;
    var msg = "Äänitiedoston lataaminen epäonnistui.";
    var detail;
    if (code === 2) detail = "Verkkoyhteys katkesi tai palvelin ei vastannut. Tarkista yhteys ja lataa sivu uudelleen.";
    else if (code === 3) detail = "Tiedosto latautui, mutta selain ei pystynyt purkamaan sitä. Tiedosto voi olla vioittunut.";
    else if (code === 4) detail = "Tiedostoa ei löytynyt tai se ei ole äänitiedosto.";
    if (/dropbox\.com/.test(gig.audio) && !/[?&]raw=1/.test(gig.audio)) {
      detail = (detail ? detail + " " : "") + "Dropbox-linkin lopussa pitää olla ?raw=1.";
    }
    showError(msg, detail);
    stopLoop();
    renderPlayState();
  });

  // ---- Toistosilmukka ---------------------------------------------------
  // requestAnimationFrame eikä timeupdate, koska timeupdate laukeaa vain
  // n. 4 kertaa sekunnissa ja nuppi liikkuisi nykien.

  function loop() {
    rafId = 0;
    if (audio.paused) return;
    checkStop();
    render();
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (!rafId) rafId = requestAnimationFrame(loop);
  }
  function stopLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  audio.addEventListener("play", function () { armStop(); renderPlayState(); startLoop(); });
  audio.addEventListener("pause", function () { stopLoop(); renderPlayState(); render(); });
  audio.addEventListener("ended", function () { stopLoop(); renderPlayState(); render(); });
  audio.addEventListener("seeked", render);
  // Piilossa render pitää myös lukitusnäytön kappaleen nimen ajan tasalla.
  // Piilossa animaatiosilmukka ei pyöri, joten setin raja tarkistetaan täällä.
  audio.addEventListener("timeupdate", function () {
    checkStop();
    if (audio.paused || document.hidden) render();
  });
  audio.addEventListener("loadedmetadata", onMeta);
  audio.addEventListener("durationchange", onMeta);

  function onMeta() {
    var d = duration();
    if (!isFinite(d)) return;
    var wasLong = longTimes;
    longTimes = d >= 3600;
    if (longTimes !== wasLong) renderList();
    else renderSetLens();
    if (pendingSeek !== null) {
      var t = pendingSeek;
      pendingSeek = null;
      audio.currentTime = Math.min(t, d);
    }
    armStop();
    els.seek.setAttribute("aria-disabled", "false");
    renderTicks();
    render();
  }

  // ---- Edistymispalkki --------------------------------------------------
  // Vedon aikana näytetään vain esikatselu; varsinainen haku tehdään kun
  // sormi nousee, ettei pitkää tiedostoa haeta verkosta jokaisella liikkeellä.
  // Jana lukitaan vedon alussa: biisijanalla oikeaan reunaan vedetty kohta on
  // jo seuraavan biisin alku, eikä jana saa vaihtua kesken vedon.

  function timeFromPointer(e) {
    var r = els.seek.getBoundingClientRect();
    var x = Math.min(Math.max(0, e.clientX - r.left), r.width);
    return dragSpan.a + (r.width ? (x / r.width) * (dragSpan.b - dragSpan.a) : 0);
  }
  els.seek.addEventListener("pointerdown", function (e) {
    if (!isFinite(duration()) || e.button > 0) return;
    dragSpan = span(trackAt(position()));
    dragging = true;
    dragTime = timeFromPointer(e);
    els.seek.setPointerCapture(e.pointerId);
    render();
    e.preventDefault();
  });
  els.seek.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    dragTime = timeFromPointer(e);
    render();
  });
  function endDrag(e, commit) {
    if (!dragging) return;
    dragging = false;
    if (commit) seekTo(timeFromPointer(e)); else render();
  }
  els.seek.addEventListener("pointerup", function (e) { endDrag(e, true); });
  els.seek.addEventListener("pointercancel", function (e) { endDrag(e, false); });

  els.seek.addEventListener("keydown", function (e) {
    if (!isFinite(duration())) return;
    var t = position(), handled = true;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") seekTo(t + 5);
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") seekTo(t - 5);
    else if (e.key === "PageUp") seekTo(t + 30);
    else if (e.key === "PageDown") seekTo(t - 30);
    else if (e.key === "Home") seekTo(span(trackAt(t)).a);
    else if (e.key === "End") seekTo(span(trackAt(t)).b);
    else handled = false;
    if (handled) e.preventDefault();
  });

  // ---- Napit ja näppäimistö ---------------------------------------------

  els.play.addEventListener("click", toggle);
  els.prev.addEventListener("click", prevTrack);
  els.next.addEventListener("click", nextTrack);
  els.back.addEventListener("click", function () { skip(-SKIP); });
  els.fwd.addEventListener("click", function () { skip(SKIP); });
  els.setonly.addEventListener("change", function () {
    setOnly = els.setonly.checked;
    armStop();
  });
  document.querySelectorAll('input[name="scale"]').forEach(function (r) {
    r.addEventListener("change", function () {
      scale = r.value;
      renderTicks();
      render();
    });
  });

  function isTextField(el) {
    if (!el) return false;
    if (el.isContentEditable) return true;
    var tag = el.tagName;
    if (tag === "TEXTAREA" || tag === "SELECT") return true;
    if (tag !== "INPUT") return false;
    return !/^(radio|checkbox|button|submit|reset|range|color|file|image)$/i.test(el.type);
  }

  // Välilyönti: estetään myös keyup, ettei fokusoitu nappi saa omaa
  // klikkaustaan välilyönnistä (silloin toisto kytkeytyisi kahdesti).
  document.addEventListener("keydown", function (e) {
    if (e.key !== " " || e.ctrlKey || e.metaKey || e.altKey || isTextField(e.target)) return;
    e.preventDefault();
    if (!e.repeat) toggle();
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === " " && !isTextField(e.target)) e.preventDefault();
  });

  // ---- URL-hash ---------------------------------------------------------

  function applyHash() {
    var m = HASH_RE.exec(location.hash);
    if (!m || !m[2]) return;
    // #tunnus/3 = 1. setin kappale 3, #tunnus/2/3 = 2. setin kappale 3.
    var set = m[3] ? +m[2] : 1, n = m[3] ? +m[3] : +m[2];
    var i = -1;
    for (var k = 0; k < tracks.length; k++) {
      if (tracks[k].set === set && tracks[k].n === n) { i = k; break; }
    }
    if (i >= 0) {
      jumpTo(i, false);
      var li = rows[i];
      if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
    }
  }
  window.addEventListener("hashchange", function () {
    var m = HASH_RE.exec(location.hash);
    // Eri keikan tunnus → ladataan sivu alusta; sama keikka → vain kappale.
    if (!m || m[1].toLowerCase() !== gigKey) location.reload();
    else if (gig) applyHash();
  });

  // ---- Lukitusnäytön ohjaimet (Media Session) ----------------------------

  function updateMediaSession() {
    if (!("mediaSession" in navigator) || !window.MediaMetadata || current < 0) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: tracks[current].title,
        album: gig.title
      });
    } catch (e) { /* ei tuettu */ }
  }
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    var set = function (a, fn) { try { ms.setActionHandler(a, fn); } catch (e) { /* ei tuettu */ } };
    set("play", play);
    set("pause", function () { audio.pause(); });
    set("previoustrack", prevTrack);
    set("nexttrack", nextTrack);
    set("seekbackward", function (d) { skip(-((d && d.seekOffset) || SKIP)); });
    set("seekforward", function (d) { skip((d && d.seekOffset) || SKIP); });
    set("seekto", function (d) { if (d && isFinite(d.seekTime)) seekTo(d.seekTime); });
  }

  // ---- Käynnistys -------------------------------------------------------

  function fail(msg, detail) {
    $("loading").hidden = true;
    showError(msg, detail);
  }

  function start(data) {
    gig = data;
    document.title = gig.title;
    els.title.textContent = gig.title;
    $("loading").hidden = true;
    $("app").hidden = false;

    var errors = loadTracks(withIntro(gig.tracks));
    if (errors.length) showError("Kappalelistassa on virhe.", errors.join(" "));
    if (!tracks.length) {
      tracks.push({ start: 0, title: gig.title, set: 1, n: 1 });
      setInfo[1] = { name: "", first: 0 };
    }

    renderList();
    render();
    renderPlayState();
    applyHash();
    audio.src = gig.audio;
  }

  var hm = HASH_RE.exec(location.hash);
  if (!hm) {
    fail("Linkistä puuttuu keikan tunnus.",
      "Tarkista, että linkki on kopioitu kokonaan, myös #-merkin jälkeinen osa.");
  } else {
    gigKey = hm[1].toLowerCase();
    fetch(API + "?k=" + encodeURIComponent(gigKey), { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) {
          throw { user: "Keikkaa ei löytynyt.",
                  detail: "Linkki voi olla vanhentunut tai kopioitunut vajaana." };
        }
        if (!res.ok) {
          throw { user: "Keikan tietoja ei saatu palvelimelta.",
                  detail: "Palvelin vastasi virheellä " + res.status + ". Yritä hetken päästä uudelleen." };
        }
        return res.json();
      })
      .then(function (data) {
        if (!data || typeof data.audio !== "string" || !Array.isArray(data.tracks)) {
          throw { user: "Keikan tiedot ovat virheelliset." };
        }
        start({ title: String(data.title || "Keikka"), audio: data.audio, tracks: data.tracks });
      })
      .catch(function (e) {
        if (e && e.user) fail(e.user, e.detail);
        else fail("Keikan tietojen haku epäonnistui.",
          "Tarkista verkkoyhteys ja lataa sivu uudelleen.");
      });
  }
})();
</script>
</body>
</html>
